<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#0c1b2a"/><stop offset="0.55" stop-color="#0f2438"/><stop offset="1" stop-color="#08131f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7c948"/><stop offset="1" stop-color="#e0a526"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6"><stop offset="0" stop-color="#1d6fb8" stop-opacity="0.35"/><stop offset="1" stop-color="#1d6fb8" stop-opacity="0"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5252"/></marker>
  </defs>
  <rect width="794" height="1123" fill="url(#bg)"/><rect width="794" height="1123" fill="url(#glow)"/>

  <!-- motivo: portería + barrera defensiva + balón con disparo -->
  <g>
    <!-- portería -->
    <rect x="250" y="640" width="294" height="120" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4"/>
    <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.4">
      <line x1="270" y1="640" x2="270" y2="760"/><line x1="290" y1="640" x2="290" y2="760"/>
      <line x1="504" y1="640" x2="504" y2="760"/><line x1="524" y1="640" x2="524" y2="760"/>
      <line x1="250" y1="660" x2="544" y2="660"/><line x1="250" y1="685" x2="544" y2="685"/>
      <line x1="250" y1="710" x2="544" y2="710"/><line x1="250" y1="735" x2="544" y2="735"/>
    </g>
    <!-- portero -->
    <circle cx="360" cy="700" r="22" fill="#0d3c75" stroke="#f7c948" stroke-width="3.5"/>
    <text x="360" y="706" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">P</text>
    <!-- barrera (4 defensores azules) -->
    <g>
      <circle cx="378" cy="860" r="24" fill="#0d3c75" stroke="#1d6fb8" stroke-width="3"/>
      <circle cx="428" cy="860" r="24" fill="#0d3c75" stroke="#1d6fb8" stroke-width="3"/>
      <circle cx="478" cy="860" r="24" fill="#0d3c75" stroke="#1d6fb8" stroke-width="3"/>
      <circle cx="528" cy="860" r="24" fill="#0d3c75" stroke="#1d6fb8" stroke-width="3"/>
    </g>
    <!-- balón y disparo bloqueado -->
    <circle cx="452" cy="1000" r="11" fill="#fafafa" stroke="#222" stroke-width="1.6"/>
    <line x1="452" y1="990" x2="430" y2="876" stroke="#ff5252" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ar)" opacity="0.9"/>
    <text x="397" y="930" font-size="13" font-weight="700" fill="#9fb3c8" text-anchor="middle">la barrera tapa · el portero cubre</text>
    <!-- lanzador rival -->
    <circle cx="452" cy="1030" r="20" fill="#c62828" stroke="#7f1414" stroke-width="3"/>
  </g>

  <rect x="0" y="0" width="794" height="8" fill="url(#gold)"/>
  <g transform="translate(64,92)">
    <rect x="0" y="0" width="46" height="46" rx="10" fill="url(#gold)"/>
    <text x="23" y="32" font-size="28" font-weight="900" fill="#0c1b2a" text-anchor="middle">ME</text>
    <text x="62" y="22" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3">MISTER ÉLITE</text>
    <text x="62" y="41" font-size="12.5" font-weight="600" fill="#f7c948" letter-spacing="2">ACADEMIA DE ENTRENADORES · MOISÉS DÍAZ</text>
  </g>
  <g transform="translate(64,250)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#7fd0ff" letter-spacing="4">CURSO DE BALÓN PARADO</text>
    <text x="0" y="64" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1.5">BALÓN PARADO</text>
    <text x="0" y="112" font-size="44" font-weight="900" fill="#f7c948" letter-spacing="-1.5">DEFENSIVO</text>
    <text x="0" y="156" font-size="20" font-weight="800" fill="#ffffff">córners · faltas · saques de banda</text>
    <line x1="4" y1="182" x2="120" y2="182" stroke="#f7c948" stroke-width="4"/>
    <text x="0" y="216" font-size="16" font-weight="500" fill="#cdd9e5">Organización, roles y principios de oro · con pizarras</text>
  </g>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(470,300)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="34" font-weight="900" fill="#f7c948">3</text><text x="18" y="66" font-size="12" fill="#cdd9e5">situaciones</text></g>
    <g transform="translate(632,300)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="34" font-weight="900" fill="#f7c948">11</text><text x="18" y="66" font-size="12" fill="#cdd9e5">pizarras</text></g>
    <g transform="translate(470,392)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="30" font-weight="900" fill="#f7c948">3</text><text x="18" y="66" font-size="12" fill="#cdd9e5">sistemas de marcaje</text></g>
    <g transform="translate(632,392)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="22" font-weight="900" fill="#f7c948">datos</text><text x="18" y="66" font-size="12" fill="#cdd9e5">y reglas IFAB</text></g>
  </g>
  <rect x="0" y="1080" width="794" height="43" fill="#08131f"/>
  <text x="64" y="1107" font-size="13" font-weight="600" fill="#8aa0b6">Zonal · Al hombre · Mixto · Barrera · Saque largo · Transición</text>
  <text x="730" y="1107" font-size="13" font-weight="800" fill="#f7c948" text-anchor="end">MISTER ÉLITE</text>
  <rect x="0" y="1115" width="794" height="8" fill="url(#gold)"/>
</svg>
