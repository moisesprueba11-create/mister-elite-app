<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#0c1b2a"/><stop offset="0.55" stop-color="#0f2438"/><stop offset="1" stop-color="#08131f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7c948"/><stop offset="1" stop-color="#e0a526"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.6"><stop offset="0" stop-color="#1d6fb8" stop-opacity="0.35"/><stop offset="1" stop-color="#1d6fb8" stop-opacity="0"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f7c948"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
  </defs>
  <rect width="794" height="1123" fill="url(#bg)"/><rect width="794" height="1123" fill="url(#glow)"/>

  <!-- motivo: rueda de pases (estaciones + secuencia numerada + sigue tu pase) -->
  <g>
    <rect x="150" y="610" width="494" height="420" rx="12" fill="#1f7a36" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="7 8"/>
    <!-- pases (amarillo discontinuo) -->
    <g stroke="#f7c948" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#ar)" opacity="0.95">
      <line x1="250" y1="930" x2="540" y2="930"/>
      <line x1="560" y1="912" x2="560" y2="710"/>
      <line x1="544" y1="690" x2="254" y2="690"/>
    </g>
    <!-- carrera "sigue tu pase" (blanco) -->
    <g stroke="#ffffff" stroke-width="2.4" stroke-dasharray="3 7" fill="none" marker-end="url(#arw)" opacity="0.8">
      <line x1="262" y1="912" x2="520" y2="912"/>
    </g>
    <!-- estaciones -->
    <g>
      <circle cx="240" cy="930" r="22" fill="#0d3c75" stroke="#1d6fb8" stroke-width="3"/><text x="240" y="936" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">A</text>
      <circle cx="560" cy="930" r="22" fill="#0d3c75" stroke="#1d6fb8" stroke-width="3"/><text x="560" y="936" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">B</text>
      <circle cx="560" cy="690" r="22" fill="#0d3c75" stroke="#1d6fb8" stroke-width="3"/><text x="560" y="696" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">C</text>
      <circle cx="240" cy="690" r="22" fill="#0d3c75" stroke="#1d6fb8" stroke-width="3"/><text x="240" y="696" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">D</text>
    </g>
    <!-- números de secuencia -->
    <g font-size="16" font-weight="900" fill="#f7c948">
      <text x="395" y="922" text-anchor="middle">1</text>
      <text x="576" y="815" text-anchor="middle">2</text>
      <text x="399" y="682" text-anchor="middle">3</text>
    </g>
    <!-- balón -->
    <circle cx="268" cy="930" r="8" fill="#fafafa" stroke="#222" stroke-width="1.5"/>
    <text x="397" y="1000" font-size="13" font-weight="700" fill="#9fb3c8" text-anchor="middle">secuencia fija · pasa y sigue tu pase</text>
  </g>

  <rect x="0" y="0" width="794" height="8" fill="url(#gold)"/>
  <g transform="translate(64,92)">
    <rect x="0" y="0" width="46" height="46" rx="10" fill="url(#gold)"/>
    <text x="23" y="32" font-size="28" font-weight="900" fill="#0c1b2a" text-anchor="middle">ME</text>
    <text x="62" y="22" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3">MISTER ÉLITE</text>
    <text x="62" y="41" font-size="12.5" font-weight="600" fill="#f7c948" letter-spacing="2">ACADEMIA DE ENTRENADORES · MOISÉS DÍAZ</text>
  </g>
  <g transform="translate(64,250)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#7fd0ff" letter-spacing="5">CURSO DE METODOLOGÍA TÉCNICA</text>
    <text x="0" y="70" font-size="60" font-weight="900" fill="#ffffff" letter-spacing="-1">RUEDAS</text>
    <text x="0" y="128" font-size="60" font-weight="900" fill="#ffffff" letter-spacing="-1">DE PASES</text>
    <text x="0" y="172" font-size="23" font-weight="800" fill="#f7c948">del patrón al partido</text>
    <line x1="4" y1="196" x2="120" y2="196" stroke="#f7c948" stroke-width="4"/>
    <text x="0" y="232" font-size="17" font-weight="500" fill="#cdd9e5">Técnica · automatismos · finalización · transferencia</text>
  </g>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(470,300)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="34" font-weight="900" fill="#f7c948">30</text><text x="18" y="66" font-size="12" fill="#cdd9e5">ruedas con pizarra</text></g>
    <g transform="translate(632,300)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="34" font-weight="900" fill="#f7c948">4</text><text x="18" y="66" font-size="12" fill="#cdd9e5">módulos de teoría</text></g>
    <g transform="translate(470,392)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="34" font-weight="900" fill="#f7c948">6</text><text x="18" y="66" font-size="12" fill="#cdd9e5">familias de rueda</text></g>
    <g transform="translate(632,392)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="22" font-weight="900" fill="#f7c948">coaching</text><text x="18" y="66" font-size="12" fill="#cdd9e5">puntos clave</text></g>
  </g>
  <rect x="0" y="1080" width="794" height="43" fill="#08131f"/>
  <text x="64" y="1107" font-size="13" font-weight="600" fill="#8aa0b6">Básicas · Movilidad · Tercer hombre · Progresión · Finalización · Oposición</text>
  <text x="730" y="1107" font-size="13" font-weight="800" fill="#f7c948" text-anchor="end">MISTER ÉLITE</text>
  <rect x="0" y="1115" width="794" height="8" fill="url(#gold)"/>
</svg>
