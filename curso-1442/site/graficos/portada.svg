<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0c1b2a"/>
      <stop offset="0.55" stop-color="#0f2438"/>
      <stop offset="1" stop-color="#08131f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#e0a526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#1d6fb8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1d6fb8" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7c948"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="794" height="1123" fill="url(#bg)"/>
  <rect width="794" height="1123" fill="url(#glow)"/>

  <!-- Medio campo táctico de fondo (sutil) -->
  <g opacity="0.16" stroke="#ffffff" stroke-width="2" fill="none">
    <rect x="120" y="470" width="554" height="600"/>
    <line x1="120" y1="770" x2="674" y2="770"/>
    <circle cx="397" cy="770" r="74"/>
    <circle cx="397" cy="770" r="3" fill="#fff"/>
    <rect x="277" y="470" width="240" height="92"/>
    <rect x="337" y="470" width="120" height="36"/>
    <rect x="277" y="978" width="240" height="92"/>
    <rect x="337" y="1034" width="120" height="36"/>
  </g>

  <!-- Formación 1-4-4-2 puntos sobre el campo de fondo -->
  <g opacity="0.92">
    <!-- conexiones -->
    <g stroke="#f7c948" stroke-width="1.6" opacity="0.5" stroke-dasharray="5 5">
      <line x1="397" y1="1012" x2="200" y2="930"/>
      <line x1="397" y1="1012" x2="330" y2="918"/>
      <line x1="397" y1="1012" x2="464" y2="918"/>
      <line x1="397" y1="1012" x2="594" y2="930"/>
      <line x1="200" y1="930" x2="200" y2="790"/>
      <line x1="330" y1="918" x2="335" y2="775"/>
      <line x1="464" y1="918" x2="459" y2="775"/>
      <line x1="594" y1="930" x2="594" y2="790"/>
      <line x1="335" y1="775" x2="350" y2="640"/>
      <line x1="459" y1="775" x2="444" y2="640"/>
    </g>
    <!-- flechas de ataque -->
    <g stroke="#f7c948" stroke-width="2.4" marker-end="url(#ar)" opacity="0.85">
      <line x1="350" y1="640" x2="360" y2="560"/>
      <line x1="444" y1="640" x2="434" y2="560"/>
    </g>
    <!-- jugadores -->
    <g font-size="13" font-weight="800" fill="#fff" text-anchor="middle">
      <g><circle cx="397" cy="1012" r="17" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/><text x="397" y="1017">1</text></g>
      <g><circle cx="200" cy="930" r="17" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/><text x="200" y="935">3</text></g>
      <g><circle cx="330" cy="918" r="17" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/><text x="330" y="923">5</text></g>
      <g><circle cx="464" cy="918" r="17" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/><text x="464" y="923">4</text></g>
      <g><circle cx="594" cy="930" r="17" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/><text x="594" y="935">2</text></g>
      <g><circle cx="200" cy="790" r="17" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/><text x="200" y="795">7</text></g>
      <g><circle cx="335" cy="775" r="17" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/><text x="335" y="780">6</text></g>
      <g><circle cx="459" cy="775" r="17" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/><text x="459" y="780">8</text></g>
      <g><circle cx="594" cy="790" r="17" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/><text x="594" y="795">11</text></g>
      <g><circle cx="350" cy="640" r="18" fill="#c62828" stroke="#f7c948" stroke-width="2.5"/><text x="350" y="645">9</text></g>
      <g><circle cx="444" cy="640" r="18" fill="#c62828" stroke="#f7c948" stroke-width="2.5"/><text x="444" y="645">10</text></g>
    </g>
  </g>

  <!-- Banda superior de marca -->
  <rect x="0" y="0" width="794" height="8" fill="url(#gold)"/>
  <g transform="translate(64,92)">
    <rect x="0" y="0" width="46" height="46" rx="10" fill="url(#gold)"/>
    <text x="23" y="32" font-size="28" font-weight="900" fill="#0c1b2a" text-anchor="middle">ME</text>
    <text x="62" y="22" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3">MISTER ÉLITE</text>
    <text x="62" y="41" font-size="12.5" font-weight="600" fill="#f7c948" letter-spacing="2">ACADEMIA DE ENTRENADORES · MOISÉS DÍAZ</text>
  </g>

  <!-- Titular -->
  <g transform="translate(64,300)">
    <text x="0" y="0" font-size="17" font-weight="700" fill="#7fd0ff" letter-spacing="6">CURSO TÁCTICO PROFESIONAL</text>
    <text x="0" y="78" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-2">1-4-4-2</text>
    <text x="0" y="136" font-size="33" font-weight="800" fill="#f7c948">del concepto al campo</text>
    <line x1="4" y1="166" x2="120" y2="166" stroke="#f7c948" stroke-width="4"/>
    <text x="0" y="206" font-size="18" font-weight="500" fill="#cdd9e5">Poca teoría. Mucha aplicación práctica.</text>
  </g>

  <!-- Tarjetas de contenido (2x2 arriba-derecha) -->
  <g font-family="Segoe UI,Arial">
    <g transform="translate(470,318)">
      <rect x="0" y="0" width="150" height="84" rx="12" fill="#13283d" stroke="#24435f" stroke-width="1"/>
      <text x="18" y="46" font-size="36" font-weight="900" fill="#f7c948">4</text>
      <text x="18" y="68" font-size="12" fill="#cdd9e5">módulos de teoría</text>
    </g>
    <g transform="translate(632,318)">
      <rect x="0" y="0" width="150" height="84" rx="12" fill="#13283d" stroke="#24435f" stroke-width="1"/>
      <text x="18" y="46" font-size="36" font-weight="900" fill="#f7c948">27</text>
      <text x="18" y="68" font-size="12" fill="#cdd9e5">tareas de campo</text>
    </g>
    <g transform="translate(470,414)">
      <rect x="0" y="0" width="150" height="84" rx="12" fill="#13283d" stroke="#24435f" stroke-width="1"/>
      <text x="18" y="46" font-size="36" font-weight="900" fill="#f7c948">+40</text>
      <text x="18" y="68" font-size="12" fill="#cdd9e5">pizarras tácticas</text>
    </g>
    <g transform="translate(632,414)">
      <rect x="0" y="0" width="150" height="84" rx="12" fill="#13283d" stroke="#24435f" stroke-width="1"/>
      <text x="18" y="46" font-size="36" font-weight="900" fill="#f7c948">2</text>
      <text x="18" y="68" font-size="12" fill="#cdd9e5">microciclos modelo</text>
    </g>
  </g>

  <!-- Pie -->
  <rect x="0" y="1080" width="794" height="43" fill="#08131f"/>
  <text x="64" y="1107" font-size="13" font-weight="600" fill="#8aa0b6">Salida · Presión · Basculación · Transiciones · Balón parado</text>
  <text x="730" y="1107" font-size="13" font-weight="800" fill="#f7c948" text-anchor="end">MISTER ÉLITE</text>
  <rect x="0" y="1115" width="794" height="8" fill="url(#gold)"/>
</svg>
