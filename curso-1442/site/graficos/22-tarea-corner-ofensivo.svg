<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <marker id="arrowY" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd24a"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="720" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="60"  width="560" height="95" />
    <rect x="20" y="250" width="560" height="95" />
    <rect x="20" y="440" width="560" height="95" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="160" y1="60" x2="160" y2="660"/>
    <line x1="300" y1="60" x2="300" y2="660"/>
    <line x1="440" y1="60" x2="440" y2="660"/>
  </g>

  <!-- Lineas del campo (porteria rival ARRIBA, ataque hacia arriba) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="60" width="560" height="600"/>
    <!-- Area grande superior -->
    <rect x="148" y="60" width="304" height="120"/>
    <!-- Area pequena superior -->
    <rect x="232" y="60" width="136" height="48"/>
  </g>
  <!-- Punto de penalti -->
  <circle cx="300" cy="142" r="3" fill="#ffffff"/>
  <!-- Semicirculo frontal del area -->
  <path d="M252,180 A56,56 0 0 0 348,180" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Porteria (arriba) -->
  <rect x="262" y="52" width="76" height="10" fill="#ffffff" stroke="#1d3557" stroke-width="1"/>

  <!-- Banderines / arcos de esquina -->
  <path d="M20,70 A10,10 0 0 0 30,60" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M580,70 A10,10 0 0 1 570,60" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- ZONA DE RECHACE / FRONTAL marcada -->
  <rect x="222" y="190" width="156" height="74" fill="#ffd24a" fill-opacity="0.20" stroke="#ffd24a" stroke-width="2.5" stroke-dasharray="6 4" rx="6"/>
  <text x="300" y="232" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">ZONA DE RECHACE</text>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Tarea — Córner ofensivo ensayado</text>

  <!-- Sentido de ataque -->
  <text x="560" y="200" fill="#ffffff" font-size="12" text-anchor="end" opacity="0.8">ataque ↑</text>

  <!-- Trayectoria del saque: pase discontinuo desde la esquina hacia el corazon del area -->
  <path d="M40,72 C150,70 250,110 300,135" fill="none" stroke="#ffd24a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowY)"/>
  <text x="170" y="98" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">saque al corazón del área</text>

  <!-- RIVALES en defensa dentro del area (rojo) -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="245" cy="110" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="245" y="115" fill="#fff" font-size="11">DEF'</text>
    <circle cx="300" cy="98"  r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="300" y="103" fill="#fff" font-size="11">DEF'</text>
    <circle cx="355" cy="110" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="355" y="115" fill="#fff" font-size="11">DEF'</text>
    <circle cx="200" cy="135" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="200" y="140" fill="#fff" font-size="11">DEF'</text>
    <circle cx="400" cy="135" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="400" y="140" fill="#fff" font-size="11">DEF'</text>
  </g>
  <!-- Portero rival -->
  <polygon points="300,70 312,90 288,90" fill="#1d3557" stroke="#ffffff" stroke-width="2"/>
  <text x="300" y="86" fill="#ffffff" font-size="10" text-anchor="middle">POR'</text>

  <!-- RUTAS DE CARRERA de los rematadores (movimiento, flechas solidas) -->
  <!-- Rematador a PRIMER PALO -->
  <path d="M255,300 C250,250 250,200 248,150" fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Rematador al PUNTO DE PENALTI -->
  <path d="M310,330 C320,260 318,200 305,160" fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Rematador a SEGUNDO PALO -->
  <path d="M420,300 C415,240 400,200 360,150" fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Etiquetas de zona de remate -->
  <g fill="#ffd24a" font-size="10" font-weight="700" text-anchor="middle">
    <text x="222" y="138">1er palo</text>
    <text x="300" y="160">penalti</text>
    <text x="378" y="138">2º palo</text>
  </g>

  <!-- BLOQUEO / CORTINA senalado -->
  <circle cx="345" cy="118" r="14" fill="none" stroke="#ffd24a" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="370" y="92" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">bloqueo (cortina)</text>
  <line x1="362" y1="98" x2="350" y2="110" stroke="#ffd24a" stroke-width="1.5"/>

  <!-- LANZADOR propio en la esquina con balon -->
  <circle cx="48" cy="80" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/>
  <text x="48" y="85" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">LANZ</text>
  <circle cx="40" cy="72" r="6" fill="url(#ball)" stroke="#1d3557" stroke-width="1"/>

  <!-- REMATADORES propios (posicion de partida) -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="255" cy="320" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="255" y="325" fill="#fff">DC</text>
    <circle cx="310" cy="350" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="310" y="355" fill="#fff">DFC</text>
    <circle cx="425" cy="320" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="425" y="325" fill="#fff">DC</text>
  </g>

  <!-- EQUILIBRIO DEFENSIVO: 1-2 jugadores propios atras -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="180" cy="470" r="18" fill="#1d6fb8" stroke="#ffd24a" stroke-width="3"/><text x="180" y="475" fill="#fff" font-size="11">MC</text>
    <circle cx="430" cy="490" r="18" fill="#1d6fb8" stroke="#ffd24a" stroke-width="3"/><text x="430" y="495" fill="#fff" font-size="11">DFC</text>
  </g>
  <text x="300" y="500" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">equilibrio defensivo (resto)</text>

  <!-- Mini-leyenda -->
  <g>
    <rect x="402" y="556" width="186" height="110" rx="6" fill="#1d3557" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.4"/>
    <text x="412" y="574" fill="#ffffff" font-size="11" font-weight="700">Leyenda</text>
    <line x1="412" y1="588" x2="442" y2="588" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="448" y="592" fill="#ffffff" font-size="10">carrera de remate</text>
    <line x1="412" y1="606" x2="442" y2="606" stroke="#ffd24a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowY)"/>
    <text x="448" y="610" fill="#ffffff" font-size="10">saque (pase)</text>
    <circle cx="419" cy="624" r="6" fill="none" stroke="#ffd24a" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="448" y="628" fill="#ffffff" font-size="10">bloqueo / cortina</text>
    <circle cx="419" cy="642" r="6" fill="#1d6fb8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="448" y="646" fill="#ffffff" font-size="10">propio</text>
    <circle cx="510" cy="642" r="6" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="522" y="646" fill="#ffffff" font-size="10">rival</text>
  </g>
</svg>
