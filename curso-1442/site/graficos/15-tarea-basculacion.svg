<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <marker id="arrowY" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd24a"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="720" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="70"  width="560" height="95" />
    <rect x="20" y="260" width="560" height="95" />
    <rect x="20" y="450" width="560" height="95" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="160" y1="70" x2="160" y2="640"/>
    <line x1="300" y1="70" x2="300" y2="640"/>
    <line x1="440" y1="70" x2="440" y2="640"/>
  </g>

  <!-- Lineas del campo (MEDIO CAMPO) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="70" width="560" height="570"/>
    <rect x="148" y="540" width="304" height="100"/>
    <rect x="232" y="600" width="136" height="40"/>
  </g>
  <path d="M252,540 A56,56 0 0 1 348,540" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Lado fuerte (balon, derecha) vs lado debil (cerrado al centro) -->
  <rect x="300" y="70" width="280" height="570" fill="#ffd24a" fill-opacity="0.07"/>
  <text x="445" y="628" fill="#ffd24a" font-size="12" font-weight="700" text-anchor="middle">LADO FUERTE (balón)</text>
  <text x="160" y="628" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" opacity="0.8">LADO DÉBIL (cerrado al centro)</text>

  <!-- Conos de carril (naranja) -->
  <g fill="#e67e22" stroke="#ffffff" stroke-width="0.6">
    <polygon points="160,360 168,374 152,374"/>
    <polygon points="300,360 308,374 292,374"/>
    <polygon points="440,360 448,374 432,374"/>
  </g>

  <!-- Dimensiones -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="20" y1="58" x2="580" y2="58"/>
    <line x1="20" y1="54" x2="20" y2="62"/>
    <line x1="580" y1="54" x2="580" y2="62"/>
    <line x1="591" y1="70" x2="591" y2="640"/>
    <line x1="587" y1="70" x2="595" y2="70"/>
    <line x1="587" y1="640" x2="595" y2="640"/>
  </g>
  <text x="300" y="51" fill="#ffffff" font-size="12" text-anchor="middle">68 m</text>
  <text x="589" y="355" fill="#ffffff" font-size="12" text-anchor="middle" transform="rotate(90 589 355)">45 m</text>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Tarea 5 — Basculación con cuerda</text>

  <!-- Atacantes (5, rivales) circulando el balon en U (lateral-central-lateral) -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="90"  cy="200" r="16" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="90"  y="205" fill="#fff" font-size="11">LAT'</text>
    <circle cx="220" cy="160" r="16" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="220" y="165" fill="#fff" font-size="11">INT'</text>
    <circle cx="300" cy="150" r="16" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="300" y="155" fill="#fff" font-size="11">MC'</text>
    <circle cx="380" cy="160" r="16" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="380" y="165" fill="#fff" font-size="11">INT'</text>
    <circle cx="510" cy="200" r="16" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="510" y="205" fill="#fff" font-size="11">LAT'</text>
  </g>
  <!-- Balon en el lado fuerte -->
  <circle cx="510" cy="218" r="6" fill="url(#ball)" stroke="#1d3557" stroke-width="1"/>

  <!-- Circulacion del balon en U (pases discontinuos amarillos) -->
  <path d="M104,206 C160,182 188,170 206,166" fill="none" stroke="#ffd24a" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowY)"/>
  <path d="M234,158 C260,152 278,151 286,151" fill="none" stroke="#ffd24a" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowY)"/>
  <path d="M314,151 C340,151 354,153 366,156" fill="none" stroke="#ffd24a" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowY)"/>
  <path d="M394,166 C440,180 470,194 494,206" fill="none" stroke="#ffd24a" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowY)"/>
  <text x="300" y="120" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">circulación en U (lateral - central - lateral)</text>

  <!-- 8 PIEZAS DEFENSIVAS basculadas al lado del balon (derecha) -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <!-- Linea de medios (4): MD-MC-MC-MI -->
    <circle cx="250" cy="370" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="250" y="375" fill="#fff">MD</text>
    <circle cx="350" cy="358" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="350" y="363" fill="#fff">MC</text>
    <circle cx="445" cy="360" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="445" y="365" fill="#fff">MC</text>
    <circle cx="530" cy="372" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="530" y="377" fill="#fff">MI</text>

    <!-- Linea defensiva (4): LD-DFC-DFC-LI -->
    <circle cx="270" cy="510" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="270" y="515" fill="#fff">LD</text>
    <circle cx="360" cy="518" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="523" fill="#fff">DFC</text>
    <circle cx="450" cy="515" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="450" y="520" fill="#fff">DFC</text>
    <circle cx="535" cy="505" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="535" y="510" fill="#fff">LI</text>
  </g>

  <!-- CUERDA / ELASTICO que une los 4 de cada linea (movimiento conjunto) -->
  <g stroke="#ffd24a" stroke-width="2.5" fill="none" opacity="0.95">
    <!-- Linea de medios -->
    <line x1="250" y1="370" x2="350" y2="358"/>
    <line x1="350" y1="358" x2="445" y2="360"/>
    <line x1="445" y1="360" x2="530" y2="372"/>
    <!-- Linea defensiva -->
    <line x1="270" y1="510" x2="360" y2="518"/>
    <line x1="360" y1="518" x2="450" y2="515"/>
    <line x1="450" y1="515" x2="535" y2="505"/>
  </g>
  <text x="200" y="365" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="end">cuerda</text>
  <text x="225" y="513" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="end">cuerda</text>

  <!-- Basculacion: ambas lineas se desplazan al lado del balon (carrera solida) -->
  <path d="M205,372 L235,371" fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M222,510 L255,510" fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Etiqueta de reajuste -->
  <text x="300" y="600" fill="#ffd24a" font-size="12" font-weight="700" text-anchor="middle">reajuste completo &lt; 3 s tras cada cambio de orientación</text>

  <!-- Mini-leyenda -->
  <g>
    <rect x="28" y="416" width="172" height="92" rx="6" fill="#1d3557" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.4"/>
    <text x="38" y="434" fill="#ffffff" font-size="11" font-weight="700">Leyenda</text>
    <line x1="38" y1="446" x2="72" y2="446" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="38" y1="446" x2="68" y2="446" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="74" y="450" fill="#ffffff" font-size="10">basculación</text>
    <line x1="38" y1="464" x2="68" y2="464" stroke="#ffd24a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowY)"/>
    <text x="74" y="468" fill="#ffffff" font-size="10">pase rival</text>
    <line x1="38" y1="482" x2="68" y2="482" stroke="#ffd24a" stroke-width="2.5"/>
    <text x="74" y="486" fill="#ffffff" font-size="10">cuerda (línea unida)</text>
    <circle cx="45" cy="499" r="6" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="74" y="503" fill="#ffffff" font-size="10">atacante rival</text>
  </g>
</svg>
