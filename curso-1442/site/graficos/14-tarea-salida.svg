<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <marker id="arrowY" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd24a"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="720" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="70"  width="560" height="95" />
    <rect x="20" y="260" width="560" height="95" />
    <rect x="20" y="450" width="560" height="95" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="160" y1="70" x2="160" y2="640"/>
    <line x1="300" y1="70" x2="300" y2="640"/>
    <line x1="440" y1="70" x2="440" y2="640"/>
  </g>

  <!-- Lineas del campo (MEDIO CAMPO, porteria propia abajo) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="70" width="560" height="570"/>
    <rect x="148" y="540" width="304" height="100"/>
    <rect x="232" y="600" width="136" height="40"/>
  </g>
  <path d="M252,540 A56,56 0 0 1 348,540" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Porteria grande propia (abajo) -->
  <rect x="262" y="632" width="76" height="10" fill="#ffffff" stroke="#1d3557" stroke-width="1"/>

  <!-- ZONAS-META de superacion (objetivo lejano ~40 m, una por banda) -->
  <g>
    <rect x="30" y="82" width="120" height="74" fill="#ffd24a" fill-opacity="0.22" stroke="#ffd24a" stroke-width="2.5" stroke-dasharray="6 4" rx="6"/>
    <text x="90" y="124" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">ZONA-META</text>
    <rect x="450" y="82" width="120" height="74" fill="#ffd24a" fill-opacity="0.22" stroke="#ffd24a" stroke-width="2.5" stroke-dasharray="6 4" rx="6"/>
    <text x="510" y="124" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">ZONA-META</text>
  </g>
  <text x="300" y="100" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">zonas-meta de superación</text>

  <!-- Dimensiones -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="20" y1="58" x2="580" y2="58"/>
    <line x1="20" y1="54" x2="20" y2="62"/>
    <line x1="580" y1="54" x2="580" y2="62"/>
    <line x1="591" y1="70" x2="591" y2="640"/>
    <line x1="587" y1="70" x2="595" y2="70"/>
    <line x1="587" y1="640" x2="595" y2="640"/>
  </g>
  <text x="300" y="51" fill="#ffffff" font-size="12" text-anchor="middle">68 m</text>
  <text x="589" y="355" fill="#ffffff" font-size="12" text-anchor="middle" transform="rotate(90 589 355)">40 m</text>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Tarea 1 — Salida 4+2 vs 2</text>

  <!-- Conos de banda (naranja) -->
  <g fill="#e67e22" stroke="#ffffff" stroke-width="0.6">
    <polygon points="30,360 38,374 22,374"/>
    <polygon points="570,360 578,374 562,374"/>
    <polygon points="30,250 38,264 22,264"/>
    <polygon points="570,250 578,264 562,264"/>
  </g>

  <!-- Cambio de orientacion premiado: salida por el lateral del lado contrario al press -->
  <path d="M252,425 C150,360 92,260 92,162" fill="none" stroke="#ffd24a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowY)"/>
  <text x="128" y="296" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">cambio de orientación</text>
  <text x="128" y="310" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">premiado (LI libre)</text>

  <!-- MC baja entre centrales (carrera solida + flecha) -->
  <path d="M300,360 L300,455" fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Comodines neutrales de banda (grises) -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="68" cy="300" r="18" fill="#888" stroke="#ffffff" stroke-width="2.5"/><text x="68" y="305" fill="#fff" font-size="11">com.</text>
    <circle cx="532" cy="300" r="18" fill="#888" stroke="#ffffff" stroke-width="2.5"/><text x="532" y="305" fill="#fff" font-size="11">com.</text>
  </g>
  <text x="68" y="332" fill="#ffd24a" font-size="10" font-weight="700" text-anchor="middle">comodín</text>
  <text x="532" y="332" fill="#ffd24a" font-size="10" font-weight="700" text-anchor="middle">comodín</text>

  <!-- Delanteros rivales que presionan (2 DC') -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="250" cy="400" r="20" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="250" y="405" fill="#fff">DC'</text>
    <circle cx="360" cy="400" r="20" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="405" fill="#fff">DC'</text>
  </g>
  <text x="305" y="380" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">2 que presionan</text>

  <!-- Equipo de construccion propio (POR + LD + DFC1 + DFC2 + LI + 1 MC) -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <!-- Portero (triangulo) -->
    <polygon points="300,592 312,614 288,614" fill="#1d3557" stroke="#ffffff" stroke-width="2"/>
    <text x="300" y="632" fill="#ffffff" font-size="12">POR</text>

    <!-- Laterales abiertos a las bandas -->
    <circle cx="60" cy="500" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="60" y="505" fill="#fff">LD</text>
    <circle cx="540" cy="500" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="540" y="505" fill="#fff">LI</text>

    <!-- Dos centrales -->
    <circle cx="225" cy="505" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="225" y="510" fill="#fff" font-size="13">DFC1</text>
    <circle cx="375" cy="505" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="375" y="510" fill="#fff" font-size="13">DFC2</text>

    <!-- MC que baja entre los centrales (posicion final del 3vs2) -->
    <circle cx="300" cy="475" r="20" fill="#1d6fb8" stroke="#ffd24a" stroke-width="3"/><text x="300" y="480" fill="#fff">MC</text>
  </g>

  <!-- Tag 3 vs 2 -->
  <text x="300" y="540" fill="#ffd24a" font-size="12" font-weight="700" text-anchor="middle">3 vs 2  (DFC1 + MC + DFC2)</text>

  <!-- Balon en el portero -->
  <circle cx="300" cy="565" r="6" fill="url(#ball)" stroke="#1d3557" stroke-width="1"/>

  <!-- Mini-leyenda -->
  <g>
    <rect x="428" y="538" width="160" height="96" rx="6" fill="#1d3557" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.4"/>
    <text x="438" y="556" fill="#ffffff" font-size="11" font-weight="700">Leyenda</text>
    <line x1="438" y1="568" x2="472" y2="568" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="438" y1="568" x2="468" y2="568" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="474" y="572" fill="#ffffff" font-size="10">carrera (sólida)</text>
    <line x1="438" y1="586" x2="468" y2="586" stroke="#ffd24a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowY)"/>
    <text x="474" y="590" fill="#ffffff" font-size="10">pase / cambio</text>
    <rect x="438" y="599" width="14" height="10" fill="#ffd24a" fill-opacity="0.22" stroke="#ffd24a" stroke-width="1"/>
    <text x="474" y="608" fill="#ffffff" font-size="10">zona-meta</text>
    <circle cx="445" cy="623" r="6" fill="#888" stroke="#ffffff" stroke-width="1.5"/>
    <text x="474" y="627" fill="#ffffff" font-size="10">comodín</text>
  </g>
</svg>
