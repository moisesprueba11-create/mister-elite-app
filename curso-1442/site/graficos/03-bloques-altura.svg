<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="860" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="60"  width="560" height="93" />
    <rect x="20" y="246" width="560" height="93" />
    <rect x="20" y="432" width="560" height="93" />
    <rect x="20" y="618" width="560" height="93" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="132" y1="60" x2="132" y2="804"/>
    <line x1="244" y1="60" x2="244" y2="804"/>
    <line x1="356" y1="60" x2="356" y2="804"/>
    <line x1="468" y1="60" x2="468" y2="804"/>
  </g>

  <!-- Lineas del campo -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="60" width="560" height="744"/>
    <line x1="20" y1="432" x2="580" y2="432"/>
    <circle cx="300" cy="432" r="62"/>
    <!-- Area grande superior (porteria rival) -->
    <rect x="148" y="60" width="304" height="100"/>
    <rect x="232" y="60" width="136" height="40"/>
    <!-- Area grande inferior (porteria propia) -->
    <rect x="148" y="704" width="304" height="100"/>
    <rect x="232" y="764" width="136" height="40"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="432" r="3"/>
    <circle cx="300" cy="130" r="3"/>
    <circle cx="300" cy="734" r="3"/>
  </g>
  <path d="M252,160 A56,56 0 0 0 348,160" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M252,704 A56,56 0 0 1 348,704" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Las tres alturas del bloque: alto, medio, bajo</text>

  <!-- Sentido de ataque -->
  <text x="560" y="430" fill="#ffffff" font-size="12" text-anchor="end" opacity="0.8">ataque ↑</text>

  <!-- =========================================================
       Escala de metros (0 m en porteria propia, abajo).
       y = 804 - (metros/105)*744
       0m=804  20m=662.3  35m=556  50m=449.7  105m=60
       Lineas de referencia:
         ALTO  -> 50 m -> y=449.7
         MEDIO -> 35 m -> y=556
         BAJO  -> 20 m -> y=662.3
       ========================================================= -->

  <!-- Escala lateral de metros -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5">
    <line x1="46" y1="60" x2="46" y2="804"/>
  </g>
  <g fill="#ffffff" font-size="10.5" text-anchor="start" opacity="0.9">
    <!-- ticks cada ~17.5 m -->
    <line x1="42" y1="804" x2="50" y2="804" stroke="#ffffff" stroke-opacity="0.7"/>
    <text x="52" y="808">0 m</text>
    <line x1="42" y1="662.3" x2="50" y2="662.3" stroke="#ffffff" stroke-opacity="0.7"/>
    <text x="52" y="666">20 m</text>
    <line x1="42" y1="556" x2="50" y2="556" stroke="#ffffff" stroke-opacity="0.7"/>
    <text x="52" y="560">35 m</text>
    <line x1="42" y1="449.7" x2="50" y2="449.7" stroke="#ffffff" stroke-opacity="0.7"/>
    <text x="52" y="453">50 m</text>
    <line x1="42" y1="60" x2="50" y2="60" stroke="#ffffff" stroke-opacity="0.7"/>
    <text x="52" y="74">105 m</text>
  </g>
  <text x="46" y="836" fill="#ffffff" font-size="11" text-anchor="middle" opacity="0.85">metros desde porteria propia</text>

  <!-- =========================================================
       BLOQUE ALTO  (azul claro)
       ultima linea ~50 m (y=449.7) ; primer presionador alto
       ========================================================= -->
  <g>
    <!-- ultima linea defensiva (punteada) -->
    <line x1="68" y1="449.7" x2="580" y2="449.7" stroke="#9ecbf0" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>
    <!-- badge -->
    <rect x="448" y="432" width="118" height="24" rx="5" fill="#9ecbf0"/>
    <text x="507" y="449" fill="#16324f" font-size="13" font-weight="700" text-anchor="middle">ALTO · 45-55 m</text>
    <!-- primer presionador (DC) alto, cerca area rival -->
    <circle cx="300" cy="180" r="20" fill="#9ecbf0" stroke="#ffffff" stroke-width="2.5"/>
    <text x="300" y="185" fill="#16324f" font-size="15" font-weight="700" text-anchor="middle">DC</text>
    <!-- flecha de carrera hacia abajo (presion) -->
    <line x1="300" y1="202" x2="300" y2="248" stroke="#9ecbf0" stroke-width="3.5" marker-end="url(#arrowAlto)"/>
  </g>

  <!-- =========================================================
       BLOQUE MEDIO  (azul medio)
       ultima linea ~35 m (y=556) ; primer presionador cerca circulo central
       ========================================================= -->
  <g>
    <line x1="68" y1="556" x2="580" y2="556" stroke="#2f86d6" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>
    <rect x="448" y="538" width="118" height="24" rx="5" fill="#2f86d6"/>
    <text x="507" y="555" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">MEDIO · 30-40 m</text>
    <!-- primer presionador (DC) alrededor del circulo central -->
    <circle cx="300" cy="410" r="20" fill="#2f86d6" stroke="#ffffff" stroke-width="2.5"/>
    <text x="300" y="415" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">DC</text>
    <line x1="300" y1="432" x2="300" y2="478" stroke="#2f86d6" stroke-width="3.5" marker-end="url(#arrowMedio)"/>
  </g>

  <!-- =========================================================
       BLOQUE BAJO  (azul oscuro)
       ultima linea ~20 m (y=662.3) ; primer presionador en torno al medio campo
       ========================================================= -->
  <g>
    <line x1="68" y1="662.3" x2="580" y2="662.3" stroke="#15406e" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>
    <rect x="448" y="644" width="118" height="24" rx="5" fill="#15406e"/>
    <text x="507" y="661" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">BAJO · 18-25 m</text>
    <!-- primer presionador (DC) en torno al medio campo (y=432) -->
    <circle cx="300" cy="432" r="20" fill="#15406e" stroke="#ffffff" stroke-width="2.5"/>
    <text x="300" y="437" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">DC</text>
    <line x1="300" y1="454" x2="300" y2="500" stroke="#15406e" stroke-width="3.5" marker-end="url(#arrowBajo)"/>
  </g>

  <!-- marcadores de flecha por color -->
  <defs>
    <marker id="arrowAlto" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9ecbf0"/>
    </marker>
    <marker id="arrowMedio" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f86d6"/>
    </marker>
    <marker id="arrowBajo" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#15406e"/>
    </marker>
  </defs>

  <!-- Porteria propia: portero de referencia -->
  <polygon points="300,752 312,774 288,774" fill="#1d3557" stroke="#ffffff" stroke-width="2"/>
  <text x="300" y="793" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">POR</text>

  <!-- =========================================================
       Mini-leyenda
       ========================================================= -->
  <g>
    <rect x="70" y="76" width="246" height="74" rx="7" fill="#1d3557" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.4"/>
    <text x="82" y="96" fill="#ffffff" font-size="12.5" font-weight="700">Leyenda</text>
    <!-- linea punteada = ultima linea -->
    <line x1="84" y1="114" x2="124" y2="114" stroke="#ffffff" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>
    <text x="132" y="118" fill="#ffffff" font-size="11.5">línea punteada = última línea defensiva</text>
    <!-- circulo = primer presionador -->
    <circle cx="104" cy="136" r="9" fill="#2f86d6" stroke="#ffffff" stroke-width="2"/>
    <text x="132" y="140" fill="#ffffff" font-size="11.5">círculo DC = primer presionador</text>
  </g>
</svg>
