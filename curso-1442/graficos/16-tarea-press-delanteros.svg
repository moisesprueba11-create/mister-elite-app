<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b71c1c"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="860" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="60"  width="560" height="93" />
    <rect x="20" y="246" width="560" height="93" />
    <rect x="20" y="432" width="560" height="93" />
    <rect x="20" y="618" width="560" height="93" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="132" y1="60" x2="132" y2="804"/>
    <line x1="244" y1="60" x2="244" y2="804"/>
    <line x1="356" y1="60" x2="356" y2="804"/>
    <line x1="468" y1="60" x2="468" y2="804"/>
  </g>

  <!-- Lineas del campo (mitad rival = arriba donde sale el balon) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="60" width="560" height="744"/>
    <line x1="20" y1="432" x2="580" y2="432"/>
    <circle cx="300" cy="432" r="62"/>
    <rect x="148" y="60" width="304" height="100"/>
    <rect x="232" y="60" width="136" height="40"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="432" r="3"/>
    <circle cx="300" cy="130" r="3"/>
  </g>
  <path d="M252,160 A56,56 0 0 0 348,160" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- ESPACIO ACOTADO DE LA TAREA (zona de presion alta) -->
  <rect x="40" y="100" width="520" height="380" fill="#ffffff" fill-opacity="0.05" stroke="#ffd24a" stroke-width="2.5" stroke-dasharray="10 7" rx="8"/>
  <text x="48" y="122" fill="#ffd24a" font-size="12" font-weight="700">Espacio de la tarea (press alto)</text>

  <!-- ZONA-META DE BANDA (donde se orienta la salida rival) -->
  <rect x="40" y="100" width="70" height="380" fill="#ffd24a" fill-opacity="0.20" stroke="#ffd24a" stroke-width="2.5" rx="6"/>
  <text x="75" y="300" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 75 300)">ZONA-META DE BANDA</text>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">Tarea: press en pareja de los dos DC</text>

  <text x="560" y="510" fill="#ffffff" font-size="12" text-anchor="end" opacity="0.8">salida rival ↓</text>

  <!-- Balon en el central rival con balon -->
  <circle cx="360" cy="200" r="9" fill="url(#ball)" stroke="#1d3557" stroke-width="1.5"/>

  <!-- Construccion rival: 2 centrales + pivote + central libre -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="360" cy="170" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="175" fill="#fff">DFC</text>
    <circle cx="220" cy="175" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="220" y="180" fill="#fff">DFC</text>
    <circle cx="300" cy="290" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="300" y="295" fill="#fff">MCD</text>
    <circle cx="490" cy="240" r="16" fill="#c0392b" stroke="#ffffff" stroke-width="2"/><text x="490" y="245" fill="#fff">LI</text>
  </g>
  <text x="300" y="318" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">pivote (en la sombra)</text>
  <text x="220" y="148" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">central libre</text>

  <!-- Dos DC propios presionan en pareja con carrera curvada -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="380" cy="420" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="380" y="425" fill="#fff">DC</text>
    <circle cx="270" cy="430" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="270" y="435" fill="#fff">DC</text>
  </g>

  <!-- Primer DC: carrera curvada que tapa la sombra al pivote y presiona al portador (continua) -->
  <path d="M378,400 C355,340 350,270 358,222" fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="420" y="330" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">tapa sombra al pivote</text>

  <!-- Segundo DC: carrera curvada para cubrir al central libre (continua) -->
  <path d="M268,410 C250,330 235,260 224,200" fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="170" y="360" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">cubre central libre</text>

  <!-- Salida rival orientada a la banda / zona-meta (discontinua roja = pase) -->
  <path d="M342,180 C260,150 160,180 120,250" fill="none" stroke="#b71c1c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/>

  <!-- Resto del equipo propio replegado-orientado (referencia) -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="140" cy="540" r="18" fill="#1d6fb8" stroke="#ffffff" stroke-width="2"/><text x="140" y="545" fill="#fff">MD</text>
    <circle cx="470" cy="540" r="18" fill="#1d6fb8" stroke="#ffffff" stroke-width="2"/><text x="470" y="545" fill="#fff">MI</text>
  </g>
  <!-- MD sale a apoyar el press hacia la banda fuerte (continua) -->
  <path d="M150,522 C170,480 160,420 130,360" fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Leyenda -->
  <g>
    <rect x="370" y="64" width="210" height="118" fill="#1d3557" fill-opacity="0.85" rx="6"/>
    <text x="382" y="84" fill="#ffffff" font-size="13" font-weight="700">Leyenda</text>
    <line x1="382" y1="100" x2="422" y2="100" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="430" y="104" fill="#ffffff" font-size="11">Movimiento</text>
    <path d="M382,120 q10,-6 20,0 t20,0" fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="430" y="124" fill="#ffffff" font-size="11">Conducción</text>
    <line x1="382" y1="140" x2="422" y2="140" stroke="#1d3557" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="430" y="144" fill="#ffffff" font-size="11">Pase</text>
    <circle cx="390" cy="160" r="7" fill="#1d6fb8" stroke="#fff" stroke-width="1.5"/>
    <text x="404" y="164" fill="#ffffff" font-size="11">Propio</text>
    <circle cx="480" cy="160" r="7" fill="#c0392b" stroke="#fff" stroke-width="1.5"/>
    <text x="494" y="164" fill="#ffffff" font-size="11">Rival</text>
  </g>
</svg>
