<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="860" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="60"  width="560" height="93" />
    <rect x="20" y="246" width="560" height="93" />
    <rect x="20" y="432" width="560" height="93" />
    <rect x="20" y="618" width="560" height="93" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="132" y1="60" x2="132" y2="804"/>
    <line x1="244" y1="60" x2="244" y2="804"/>
    <line x1="356" y1="60" x2="356" y2="804"/>
    <line x1="468" y1="60" x2="468" y2="804"/>
  </g>
  <!-- Franjas horizontales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="20" y1="308" x2="580" y2="308"/>
    <line x1="20" y1="556" x2="580" y2="556"/>
  </g>

  <!-- Lineas del campo -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="60" width="560" height="744"/>
    <line x1="20" y1="432" x2="580" y2="432"/>
    <circle cx="300" cy="432" r="62"/>
    <!-- Area grande superior (porteria rival) -->
    <rect x="148" y="60" width="304" height="100"/>
    <rect x="232" y="60" width="136" height="40"/>
    <!-- Area grande inferior (porteria propia) -->
    <rect x="148" y="704" width="304" height="100"/>
    <rect x="232" y="764" width="136" height="40"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="432" r="3"/>
    <circle cx="300" cy="130" r="3"/>
    <circle cx="300" cy="734" r="3"/>
  </g>
  <path d="M252,160 A56,56 0 0 0 348,160" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M252,704 A56,56 0 0 1 348,704" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Zona sombreada: banda lejana concedida (izquierda) -->
  <polygon points="20,60 132,60 132,804 20,804" fill="#ffd166" fill-opacity="0.18" stroke="#ffd166" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="76" y="440" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(-90 76 440)">banda lejana concedida</text>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">2 vs 3 en el centro: pellizco del extremo</text>

  <!-- Sentido de ataque -->
  <text x="560" y="430" fill="#ffffff" font-size="12" text-anchor="end" opacity="0.8">ataque ↑</text>

  <!-- Flecha de pellizco del MI al centro -->
  <path d="M150,470 Q230,470 280,448" stroke="#1d3557" stroke-width="3.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Rivales: tres MC en triangulo (pivote bajo + dos altos) -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="300" cy="500" r="19" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="300" y="505" fill="#fff">MC'</text>
    <circle cx="250" cy="400" r="19" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="250" y="405" fill="#fff">MC'</text>
    <circle cx="350" cy="400" r="19" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="350" y="405" fill="#fff">MC'</text>
  </g>
  <!-- Balon en el centro rival -->
  <circle cx="300" cy="475" r="6" fill="url(#ball)" stroke="#1d3557" stroke-width="1"/>

  <!-- Jugadores propios -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <!-- Portero -->
    <polygon points="300,752 312,774 288,774" fill="#1d3557" stroke="#ffffff" stroke-width="2"/>
    <text x="300" y="793" fill="#ffffff" font-size="13">POR</text>

    <!-- Defensa (4) en posicion -->
    <g>
      <circle cx="110" cy="660" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="110" y="665" fill="#fff">LD</text>
      <circle cx="240" cy="676" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="240" y="681" fill="#fff">DFC</text>
      <circle cx="360" cy="676" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="681" fill="#fff">DFC</text>
      <circle cx="490" cy="660" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="490" y="665" fill="#fff">LI</text>
    </g>

    <!-- Medios: 2 MC centrales + MD en banda + MI pellizcando al centro -->
    <g>
      <!-- MD se mantiene en su banda -->
      <circle cx="505" cy="470" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="505" y="475" fill="#fff">MD</text>
      <!-- 2 MC propios (en inferioridad 2 vs 3) -->
      <circle cx="265" cy="540" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="265" y="545" fill="#fff">MC</text>
      <circle cx="345" cy="540" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="345" y="545" fill="#fff">MC</text>
      <!-- MI ya pellizcado al centro (forma el 3 funcional) -->
      <circle cx="305" cy="430" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="305" y="435" fill="#fff">MI</text>
    </g>

    <!-- Delanteros (2) en posicion -->
    <g>
      <circle cx="240" cy="270" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="240" y="275" fill="#fff">DC</text>
      <circle cx="360" cy="270" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="275" fill="#fff">DC</text>
    </g>
  </g>

  <!-- Etiqueta del 3 funcional -->
  <text x="200" y="500" fill="#ffffff" font-size="12" font-weight="700" text-anchor="start" opacity="0.9">3 funcional: MI + MC + MC</text>

  <!-- Mini-leyenda -->
  <g>
    <rect x="20" y="816" width="560" height="34" fill="#1d3557" fill-opacity="0.85"/>
    <line x1="40" y1="833" x2="80" y2="833" stroke="#1d3557" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="40" y1="833" x2="80" y2="833" stroke="#ffffff" stroke-width="3.5" marker-end="url(#arrow)"/>
    <text x="92" y="838" fill="#ffffff" font-size="13" text-anchor="start">flecha continua = pellizco al centro</text>
    <rect x="340" y="824" width="22" height="16" fill="#ffd166" fill-opacity="0.4" stroke="#ffd166" stroke-width="1.5"/>
    <text x="370" y="838" fill="#ffffff" font-size="13" text-anchor="start">zona sombreada = banda concedida</text>
  </g>
</svg>
