<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <marker id="arrowPass" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd24a"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Fondo general -->
  <rect x="0" y="0" width="1000" height="640" fill="#16324a"/>

  <!-- Titulo -->
  <rect x="0" y="0" width="1000" height="44" fill="#1d3557"/>
  <text x="500" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Desdoblamiento lateral-extremo: overlap y underlap</text>

  <!-- ===================== ESCENA 1: OVERLAP ===================== -->
  <g>
    <!-- Cesped -->
    <rect x="30" y="64" width="440" height="556" fill="#2e7d32"/>
    <g fill="#2f8235">
      <rect x="30" y="64"  width="440" height="70" />
      <rect x="30" y="204" width="440" height="70" />
      <rect x="30" y="344" width="440" height="70" />
      <rect x="30" y="484" width="440" height="70" />
    </g>
    <!-- Lineas -->
    <g fill="none" stroke="#ffffff" stroke-width="2.5">
      <rect x="40" y="72" width="420" height="540"/>
      <rect x="150" y="72" width="200" height="76"/>
      <rect x="210" y="72" width="80" height="30"/>
    </g>
    <line x1="40" y1="148" x2="460" y2="148" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 6" opacity="0.9"/>
    <text x="500" y="0"/>
    <text x="250" y="92" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">OVERLAP</text>

    <!-- Defensor rival que marca al extremo -->
    <circle cx="120" cy="270" r="17" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/>
    <text x="120" y="275" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">LAT</text>

    <!-- Extremo FIJA DENTRO (con balon) -->
    <circle cx="160" cy="320" r="19" fill="#1d6fb8" stroke="#ffd24a" stroke-width="3"/>
    <text x="160" y="325" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">ED</text>
    <text x="160" y="358" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">fija dentro</text>
    <circle cx="178" cy="318" r="6" fill="url(#ball)" stroke="#1d3557" stroke-width="1.5"/>

    <!-- Movimiento del extremo hacia dentro -->
    <g fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)">
      <line x1="120" y1="380" x2="155" y2="345"/>
    </g>

    <!-- Lateral sube POR FUERA -->
    <circle cx="70" cy="470" r="19" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="70" y="475" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">LD</text>
    <g fill="none" stroke="#1d3557" stroke-width="3.2" marker-end="url(#arrow)">
      <path d="M70,450 C66,360 70,280 72,200"/>
    </g>
    <text x="58" y="190" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="start">sube por fuera</text>
    <!-- Pase exterior al lateral que desborda -->
    <g fill="none" stroke="#ffd24a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowPass)">
      <path d="M150,308 C120,260 95,225 80,200"/>
    </g>
  </g>

  <!-- ===================== ESCENA 2: UNDERLAP ===================== -->
  <g>
    <!-- Cesped -->
    <rect x="530" y="64" width="440" height="556" fill="#2e7d32"/>
    <g fill="#2f8235">
      <rect x="530" y="64"  width="440" height="70" />
      <rect x="530" y="204" width="440" height="70" />
      <rect x="530" y="344" width="440" height="70" />
      <rect x="530" y="484" width="440" height="70" />
    </g>
    <!-- Lineas -->
    <g fill="none" stroke="#ffffff" stroke-width="2.5">
      <rect x="540" y="72" width="420" height="540"/>
      <rect x="650" y="72" width="200" height="76"/>
      <rect x="710" y="72" width="80" height="30"/>
    </g>
    <line x1="540" y1="148" x2="960" y2="148" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 6" opacity="0.9"/>
    <text x="750" y="92" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">UNDERLAP</text>

    <!-- Defensor rival que marca al extremo -->
    <circle cx="620" cy="270" r="17" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/>
    <text x="620" y="275" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">LAT</text>

    <!-- Extremo RETIENE FUERA (con balon) -->
    <circle cx="580" cy="320" r="19" fill="#1d6fb8" stroke="#ffd24a" stroke-width="3"/>
    <text x="580" y="325" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">ED</text>
    <text x="580" y="358" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">retiene fuera</text>
    <circle cx="598" cy="318" r="6" fill="url(#ball)" stroke="#1d3557" stroke-width="1.5"/>

    <!-- Lateral entra POR DENTRO -->
    <circle cx="600" cy="470" r="19" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="600" y="475" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">LD</text>
    <g fill="none" stroke="#1d3557" stroke-width="3.2" marker-end="url(#arrow)">
      <path d="M600,450 C640,370 680,290 700,200"/>
    </g>
    <text x="712" y="200" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="start">entra por dentro</text>
    <!-- Pase interior al lateral que se cuela -->
    <g fill="none" stroke="#ffd24a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowPass)">
      <path d="M595,304 C640,260 675,225 698,200"/>
    </g>
  </g>

  <!-- Leyenda -->
  <g>
    <rect x="30" y="586" width="500" height="0" fill="none"/>
    <rect x="350" y="556" width="0" height="0"/>
  </g>
  <g>
    <rect x="370" y="48" width="0" height="0"/>
  </g>
  <g>
    <rect x="0" y="600" width="1000" height="40" fill="#1d3557"/>
    <line x1="40" y1="620" x2="78" y2="620" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="36" y="612" width="46" height="16" fill="#2f8235" opacity="0"/>
    <line x1="120" y1="620" x2="158" y2="620" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="168" y="624" fill="#ffffff" font-size="12">movimiento</text>
    <line x1="290" y1="620" x2="328" y2="620" stroke="#ffd24a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowPass)"/>
    <text x="338" y="624" fill="#ffffff" font-size="12">pase</text>
    <line x1="420" y1="620" x2="458" y2="620" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 6"/>
    <text x="468" y="624" fill="#ffffff" font-size="12">línea rival</text>
    <circle cx="600" cy="620" r="6" fill="#1d6fb8" stroke="#fff" stroke-width="1.5"/><text x="612" y="624" fill="#ffffff" font-size="12">propio</text>
    <circle cx="690" cy="620" r="6" fill="#c0392b" stroke="#fff" stroke-width="1.5"/><text x="702" y="624" fill="#ffffff" font-size="12">rival</text>
  </g>
</svg>
