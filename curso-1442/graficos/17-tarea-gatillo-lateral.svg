<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <marker id="arrowY" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd24a"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas (banda ancha) -->
  <rect x="0" y="0" width="760" height="540" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="80"  width="720" height="135" />
    <rect x="20" y="350" width="720" height="135" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="170" y1="80" x2="170" y2="500"/>
    <line x1="320" y1="80" x2="320" y2="500"/>
    <line x1="440" y1="80" x2="440" y2="500"/>
    <line x1="590" y1="80" x2="590" y2="500"/>
  </g>

  <!-- Rectangulo de banda ancha (todo el ancho x 45 m) -->
  <rect x="20" y="80" width="720" height="420" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Dimensiones -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="20" y1="68" x2="740" y2="68"/>
    <line x1="20" y1="64" x2="20" y2="72"/>
    <line x1="740" y1="64" x2="740" y2="72"/>
    <line x1="751" y1="80" x2="751" y2="500"/>
    <line x1="747" y1="80" x2="755" y2="80"/>
    <line x1="747" y1="500" x2="755" y2="500"/>
  </g>
  <text x="380" y="61" fill="#ffffff" font-size="12" text-anchor="middle">ancho completo (68 m)</text>
  <text x="749" y="290" fill="#ffffff" font-size="12" text-anchor="middle" transform="rotate(90 749 290)">45 m</text>

  <!-- Titulo -->
  <rect x="0" y="0" width="760" height="44" fill="#1d3557"/>
  <text x="380" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Tarea 11 — Gatillo del lateral</text>

  <!-- Conos -->
  <g fill="#e67e22" stroke="#ffffff" stroke-width="0.6">
    <polygon points="320,490 328,504 312,504"/>
    <polygon points="590,490 598,504 582,504"/>
  </g>

  <!-- Carril del gatillo (zona acotada banda derecha) -->
  <rect x="590" y="86" width="148" height="410" fill="#ffd24a" fill-opacity="0.08" stroke="#ffd24a" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="664" y="104" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">carril del gatillo</text>

  <!-- ===== RIVAL (rojo) ===== -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <!-- central rival con balon -->
    <circle cx="430" cy="180" r="20" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="430" y="185" fill="#fff">DFC'</text>
    <!-- lateral rival que recibe el gatillo -->
    <circle cx="640" cy="220" r="20" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="640" y="225" fill="#fff">LD'</text>
    <!-- extremo rival a vigilar -->
    <circle cx="660" cy="400" r="20" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="660" y="405" fill="#fff">EXT'</text>
  </g>
  <!-- Balon en el central rival -->
  <circle cx="450" cy="196" r="6" fill="url(#ball)" stroke="#1d3557" stroke-width="1"/>

  <!-- PASE GATILLO: central -> lateral (discontinuo amarillo, destacado/grueso) -->
  <path d="M452,188 C520,200 580,208 612,214" fill="none" stroke="#ffd24a" stroke-width="4.5" stroke-dasharray="9 5" marker-end="url(#arrowY)"/>
  <!-- Momento-gatillo marcado -->
  <circle cx="535" cy="202" r="16" fill="none" stroke="#ffd24a" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="535" y="170" fill="#ffd24a" font-size="13" font-weight="700" text-anchor="middle">¡GATILLO!</text>

  <!-- ===== PROPIOS (azul) salto coordinado ===== -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <!-- MD salta al lateral rival (desde dentro hacia fuera) -->
    <circle cx="540" cy="360" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="540" y="365" fill="#fff">MD</text>
    <!-- DC cierra el pase atras al central -->
    <circle cx="360" cy="290" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="295" fill="#fff">DC</text>
    <!-- MC tapa el interior -->
    <circle cx="430" cy="370" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="430" y="375" fill="#fff">MC</text>
    <!-- Lateral propio sube a vigilar al extremo rival -->
    <circle cx="580" cy="470" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="580" y="475" fill="#fff">LD</text>
  </g>

  <!-- MD SALTA al lateral (carrera agresiva de dentro a fuera, cierra centro) -->
  <path d="M555,343 C590,300 612,265 628,238" fill="none" stroke="#1d3557" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="320" fill="#1d3557" font-size="11" font-weight="700" text-anchor="middle">salto al LD'</text>

  <!-- DC cierra la vuelta al central (solida) -->
  <path d="M375,275 C390,250 405,225 418,205" fill="none" stroke="#1d3557" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="350" y="240" fill="#1d3557" font-size="11" font-weight="700" text-anchor="middle">cierra atrás</text>

  <!-- MC desplaza a cubrir el interior (solida) -->
  <path d="M430,350 L430,265" fill="none" stroke="#1d3557" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="406" y="305" fill="#1d3557" font-size="11" font-weight="700" text-anchor="middle">cubre interior</text>

  <!-- Lateral propio sube a vigilar al extremo rival (solida) -->
  <path d="M590,452 C610,425 628,408 642,398" fill="none" stroke="#1d3557" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="582" y="438" fill="#1d3557" font-size="11" font-weight="700" text-anchor="middle">vigila EXT'</text>

  <!-- CADENA de cobertura detras del que salta -->
  <path d="M448,365 C490,372 512,368 522,364" fill="none" stroke="#1d3557" stroke-width="2" stroke-dasharray="3 4" opacity="0.8"/>
  <path d="M380,300 C415,335 420,350 425,352" fill="none" stroke="#1d3557" stroke-width="2" stroke-dasharray="3 4" opacity="0.8"/>
  <text x="470" y="410" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">cadena de cobertura tras el saltador</text>

  <!-- Etiqueta clave -->
  <text x="200" y="465" fill="#ffd24a" font-size="13" font-weight="700" text-anchor="middle">saltar a la señal, no antes</text>

  <!-- Mini-leyenda -->
  <g>
    <rect x="34" y="86" width="216" height="110" rx="7" fill="#1d3557" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.4"/>
    <text x="46" y="106" fill="#ffffff" font-size="12" font-weight="700">Leyenda</text>
    <line x1="46" y1="124" x2="84" y2="124" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
    <line x1="46" y1="124" x2="80" y2="124" stroke="#1d3557" stroke-width="3.5" marker-end="url(#arrow)"/>
    <text x="90" y="128" fill="#ffffff" font-size="11">carrera / salto</text>
    <line x1="46" y1="146" x2="80" y2="146" stroke="#ffd24a" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#arrowY)"/>
    <text x="90" y="150" fill="#ffffff" font-size="11">pase gatillo</text>
    <line x1="46" y1="166" x2="80" y2="166" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="46" y1="166" x2="80" y2="166" stroke="#1d3557" stroke-width="2" stroke-dasharray="3 4"/>
    <text x="90" y="170" fill="#ffffff" font-size="11">cadena de cobertura</text>
    <circle cx="53" cy="186" r="7" fill="#1d6fb8" stroke="#fff" stroke-width="1.5"/>
    <text x="68" y="190" fill="#ffffff" font-size="11">propio</text>
    <circle cx="150" cy="186" r="7" fill="#c0392b" stroke="#fff" stroke-width="1.5"/>
    <text x="165" y="190" fill="#ffffff" font-size="11">rival</text>
  </g>
</svg>
