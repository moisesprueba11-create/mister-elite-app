<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowRun" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <marker id="arrowCover" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="560" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="60"  width="560" height="93" />
    <rect x="20" y="246" width="560" height="93" />
    <rect x="20" y="432" width="560" height="88" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="132" y1="60" x2="132" y2="520"/>
    <line x1="244" y1="60" x2="244" y2="520"/>
    <line x1="356" y1="60" x2="356" y2="520"/>
    <line x1="468" y1="60" x2="468" y2="520"/>
  </g>

  <!-- Lineas del campo (zona media: campo abierto arriba y abajo) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="60" width="560" height="460"/>
    <line x1="20" y1="290" x2="580" y2="290"/>
    <circle cx="300" cy="290" r="62"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="290" r="3"/>
  </g>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">Tarea: contrapresión — saltar al balón (5 s)</text>

  <!-- ZONA ACOTADA: radio de contrapresion alrededor del balon perdido -->
  <circle cx="300" cy="300" r="120" fill="#c0392b" fill-opacity="0.10" stroke="#c0392b" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="300" y="188" fill="#ffd24a" font-size="11.5" font-weight="700" text-anchor="middle">zona de contrapresión inmediata</text>

  <!-- RELOJ / CUENTA DE 5 SEGUNDOS -->
  <g>
    <circle cx="510" cy="470" r="34" fill="#1d3557" stroke="#ffffff" stroke-width="2.5"/>
    <text x="510" y="466" fill="#ffd24a" font-size="22" font-weight="700" text-anchor="middle">5"</text>
    <text x="510" y="484" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">recuperar</text>
    <path d="M510,470 L510,446" stroke="#ffd24a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M510,470 L527,478" stroke="#ffd24a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- MOMENTO DE LA PERDIDA marcado -->
  <text x="300" y="270" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle" opacity="0.95">¡PÉRDIDA!</text>

  <!-- Balon perdido en el centro -->
  <circle cx="300" cy="300" r="7" fill="url(#ball)" stroke="#1d3557" stroke-width="1"/>
  <circle cx="300" cy="300" r="1.8" fill="#1d3557"/>

  <!-- Rival que recibe el balon (rojo) -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="300" cy="320" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/>
    <text x="300" y="325" fill="#ffffff">RIV'</text>
    <!-- opciones de pase corto rival (a tapar) -->
    <circle cx="180" cy="380" r="17" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/>
    <text x="180" y="385" fill="#ffffff">R'</text>
    <circle cx="420" cy="380" r="17" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/>
    <text x="420" y="385" fill="#ffffff">R'</text>
    <circle cx="300" cy="430" r="17" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/>
    <text x="300" y="435" fill="#ffffff">R'</text>
  </g>

  <!-- =========================================================
       PROPIOS (azul): 3 mas cercanos SALTAN al balon
       ========================================================= -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="240" cy="240" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="240" y="245" fill="#fff">MC</text>
    <circle cx="360" cy="240" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="360" y="245" fill="#fff">MD</text>
    <circle cx="300" cy="200" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="300" y="205" fill="#fff">DC</text>
  </g>

  <!-- 3 FLECHAS de salto al balon (continuo) -->
  <path d="M252,258 C266,275 276,283 287,292" fill="none" stroke="#1d3557" stroke-width="3.5" marker-end="url(#arrowRun)"/>
  <path d="M348,258 C334,275 324,283 313,292" fill="none" stroke="#1d3557" stroke-width="3.5" marker-end="url(#arrowRun)"/>
  <path d="M300,222 L300,278" fill="none" stroke="#1d3557" stroke-width="3.5" marker-end="url(#arrowRun)"/>
  <text x="372" y="290" fill="#1d3557" font-size="11" font-weight="700" text-anchor="middle">saltan al balón</text>

  <!-- RESTO cierra lineas de pase cortas (azul mas lejano) -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="120" cy="320" r="18" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="120" y="325" fill="#fff">LD</text>
    <circle cx="480" cy="320" r="18" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="480" y="325" fill="#fff">LI</text>
    <circle cx="240" cy="440" r="18" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="240" y="445" fill="#fff">DFC</text>
  </g>

  <!-- LINEAS DISCONTINUAS: cierran lineas de pase cortas (blanco cobertura) -->
  <path d="M137,335 C152,352 165,362 173,368" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.9" marker-end="url(#arrowCover)"/>
  <path d="M463,335 C448,352 435,362 427,368" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.9" marker-end="url(#arrowCover)"/>
  <path d="M255,430 C272,420 282,420 290,428" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.9" marker-end="url(#arrowCover)"/>
  <text x="110" y="362" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle" opacity="0.9">cierra pase</text>

  <!-- =========================================================
       Leyenda
       ========================================================= -->
  <g>
    <rect x="30" y="60" width="232" height="86" rx="7" fill="#1d3557" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.4"/>
    <text x="42" y="82" fill="#ffffff" font-size="12.5" font-weight="700">Leyenda</text>
    <line x1="44" y1="102" x2="78" y2="102" stroke="#1d3557" stroke-width="3.5" marker-end="url(#arrowRun)"/>
    <text x="90" y="106" fill="#ffffff" font-size="11.5">continua = salto al balón</text>
    <line x1="44" y1="126" x2="78" y2="126" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrowCover)"/>
    <text x="90" y="130" fill="#ffffff" font-size="11.5">discontinua = cierra línea de pase</text>
  </g>
</svg>
