<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowRun" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/>
    </marker>
    <marker id="arrowPass" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd24a"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="560" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="60" y="80"  width="480" height="92" />
    <rect x="60" y="264" width="480" height="92" />
    <rect x="60" y="448" width="480" height="32" />
  </g>

  <!-- Rectangulo de juego 45 x 40 m -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="60" y="80" width="480" height="400"/>
    <line x1="60" y1="280" x2="540" y2="280"/>
  </g>
  <circle cx="300" cy="280" r="3" fill="#ffffff"/>

  <!-- Dimensiones 45 x 40 m -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none">
    <line x1="60" y1="494" x2="540" y2="494"/>
    <line x1="60" y1="490" x2="60" y2="498"/>
    <line x1="540" y1="490" x2="540" y2="498"/>
    <line x1="46" y1="80" x2="46" y2="480"/>
    <line x1="42" y1="80" x2="50" y2="80"/>
    <line x1="42" y1="480" x2="50" y2="480"/>
  </g>
  <text x="300" y="510" fill="#ffffff" font-size="12" text-anchor="middle">45 m</text>
  <text x="36" y="280" fill="#ffffff" font-size="12" transform="rotate(-90 36 280)" text-anchor="middle">40 m</text>

  <!-- Mini-porterias (4: 2 por equipo en cada fondo) -->
  <g fill="none" stroke="#ffffff" stroke-width="3">
    <!-- Fondo superior -->
    <rect x="150" y="74" width="52" height="12"/>
    <rect x="398" y="74" width="52" height="12"/>
    <!-- Fondo inferior -->
    <rect x="150" y="474" width="52" height="12"/>
    <rect x="398" y="474" width="52" height="12"/>
  </g>
  <text x="300" y="64" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">4 mini-porterías (2 por equipo)</text>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Tarea 19 — Contrapresión 5 segundos</text>

  <!-- Reloj 5 s -->
  <g>
    <circle cx="500" cy="120" r="22" fill="#1d3557" stroke="#ffffff" stroke-width="2"/>
    <line x1="500" y1="120" x2="500" y2="104" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="500" y1="120" x2="512" y2="126" stroke="#ffffff" stroke-width="2.5"/>
    <text x="500" y="160" fill="#ffd24a" font-size="13" font-weight="700" text-anchor="middle">5 s</text>
  </g>

  <!-- Momento de la perdida (balon) -->
  <circle cx="300" cy="300" r="7" fill="url(#ball)" stroke="#1d3557" stroke-width="1"/>
  <text x="300" y="332" fill="#ffd24a" font-size="12" font-weight="700" text-anchor="middle">pérdida</text>

  <!-- 2-3 mas cercanos saltan al balon (solido convergente) -->
  <path d="M232,250 C258,270 270,278 288,294" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowRun)"/>
  <path d="M370,250 C344,270 330,278 312,294" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowRun)"/>
  <path d="M300,378 C300,355 300,340 300,316" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowRun)"/>
  <text x="300" y="404" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">2-3 más cercanos saltan al balón</text>

  <!-- El resto cierra lineas de pase cortas (solido posicionando sobre la linea) -->
  <path d="M150,200 C175,210 190,216 210,224" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowRun)"/>
  <path d="M455,200 C430,210 415,216 395,224" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowRun)"/>
  <text x="135" y="190" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">cierran líneas de pase</text>

  <!-- Jugadores propios (azules) - los que pierden y presionan -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="222" cy="240" r="19" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="222" y="245" fill="#fff">MC</text>
    <circle cx="380" cy="240" r="19" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="380" y="245" fill="#fff">MD</text>
    <circle cx="300" cy="392" r="19" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="300" y="397" fill="#fff">MC</text>
    <circle cx="140" cy="190" r="19" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="140" y="195" fill="#fff">DFC</text>
    <circle cx="465" cy="190" r="19" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="465" y="195" fill="#fff">DFC</text>
  </g>

  <!-- Jugadores rivales (rojos) - quienes reciben tras la perdida -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="300" cy="280" r="19" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="300" y="285" fill="#fff">MC'</text>
    <circle cx="190" cy="320" r="19" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="190" y="325" fill="#fff">MC'</text>
    <circle cx="420" cy="320" r="19" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="420" y="325" fill="#fff">DC'</text>
  </g>

  <!-- Nota primer defensor -->
  <text x="300" y="540" fill="#ffd24a" font-size="12" font-weight="700" text-anchor="middle">el primer defensor es el que ha perdido el balón</text>

  <!-- Mini-leyenda -->
  <g>
    <rect x="60" y="358" width="150" height="100" fill="#1d3557" fill-opacity="0.85" stroke="#ffffff" stroke-width="1"/>
    <text x="68" y="376" fill="#ffffff" font-size="11" font-weight="700">LEYENDA</text>
    <line x1="68" y1="389" x2="98" y2="389" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowRun)"/>
    <text x="104" y="393" fill="#ffffff" font-size="10">presión / cierre</text>
    <circle cx="76" cy="409" r="7" fill="#1d6fb8" stroke="#ffffff" stroke-width="2"/>
    <text x="104" y="413" fill="#ffffff" font-size="10">propio</text>
    <circle cx="76" cy="429" r="7" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
    <text x="104" y="433" fill="#ffffff" font-size="10">rival</text>
    <rect x="69" y="444" width="14" height="6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="104" y="451" fill="#ffffff" font-size="10">mini-portería</text>
  </g>
</svg>
