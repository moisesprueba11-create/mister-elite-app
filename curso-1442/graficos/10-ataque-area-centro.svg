<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <marker id="arrowPass" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd24a"/>
    </marker>
    <marker id="arrowCross" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="860" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="60"  width="560" height="93" />
    <rect x="20" y="246" width="560" height="93" />
    <rect x="20" y="432" width="560" height="93" />
    <rect x="20" y="618" width="560" height="93" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="132" y1="60" x2="132" y2="804"/>
    <line x1="244" y1="60" x2="244" y2="804"/>
    <line x1="356" y1="60" x2="356" y2="804"/>
    <line x1="468" y1="60" x2="468" y2="804"/>
  </g>
  <!-- Franjas horizontales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="20" y1="308" x2="580" y2="308"/>
    <line x1="20" y1="556" x2="580" y2="556"/>
  </g>

  <!-- Lineas del campo -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="60" width="560" height="744"/>
    <line x1="20" y1="432" x2="580" y2="432"/>
    <circle cx="300" cy="432" r="62"/>
    <rect x="148" y="60" width="304" height="100"/>
    <rect x="232" y="60" width="136" height="40"/>
    <rect x="148" y="704" width="304" height="100"/>
    <rect x="232" y="764" width="136" height="40"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="432" r="3"/>
    <circle cx="300" cy="130" r="3"/>
    <circle cx="300" cy="734" r="3"/>
  </g>
  <path d="M252,160 A56,56 0 0 0 348,160" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M252,704 A56,56 0 0 1 348,704" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Ataque del área: centro desde banda derecha</text>

  <text x="560" y="430" fill="#ffffff" font-size="12" text-anchor="end" opacity="0.8">ataque ↑</text>

  <!-- Centro lateral desde banda derecha (linea blanca = centro) -->
  <g fill="none" stroke="#ffffff" stroke-width="3.4" marker-end="url(#arrowCross)">
    <path d="M118,118 C200,95 280,95 318,108"/>
  </g>
  <text x="120" y="138" fill="#ffffff" font-size="12" font-weight="700">centro</text>

  <!-- CUT-BACK resaltado (pase atras a la frontal) -->
  <g fill="none" stroke="#ffd24a" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowPass)">
    <path d="M168,118 C220,150 270,175 296,206"/>
  </g>
  <text x="150" y="178" fill="#ffd24a" font-size="13" font-weight="700">CUT-BACK</text>

  <!-- Movimientos de ocupacion del area -->
  <g fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)">
    <!-- DC al primer palo -->
    <line x1="248" y1="248" x2="216" y2="138"/>
    <!-- DC al segundo palo -->
    <line x1="360" y1="248" x2="392" y2="138"/>
    <!-- MC llegador a la frontal -->
    <line x1="320" y1="320" x2="304" y2="200"/>
  </g>

  <!-- Defensa rival (ultima linea en el area) -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="200" cy="120" r="17" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="200" y="125" fill="#fff">DFC</text>
    <circle cx="300" cy="112" r="17" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="300" y="117" fill="#fff">DFC</text>
    <circle cx="400" cy="120" r="17" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="400" y="125" fill="#fff">DFC</text>
    <circle cx="260" cy="90" r="17" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="260" y="95" fill="#fff">DFC</text>
  </g>

  <!-- Balon en banda derecha -->
  <circle cx="108" cy="120" r="7" fill="url(#ball)" stroke="#1d3557" stroke-width="1.5"/>

  <!-- Jugadores propios -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <polygon points="300,752 312,774 288,774" fill="#1d3557" stroke="#ffffff" stroke-width="2"/>
    <text x="300" y="793" fill="#ffffff" font-size="13">POR (1)</text>

    <circle cx="110" cy="560" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="110" y="565" fill="#fff">LD</text>
    <circle cx="240" cy="676" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="240" y="681" fill="#fff">DFC</text>
    <circle cx="360" cy="676" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="681" fill="#fff">DFC</text>
    <circle cx="490" cy="620" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="490" y="625" fill="#fff">LI</text>

    <!-- Extremo derecho centrando -->
    <circle cx="110" cy="130" r="20" fill="#1d6fb8" stroke="#ffd24a" stroke-width="3"/><text x="110" y="135" fill="#fff">ED</text>
    <!-- MC ancla cubriendo / 6 -->
    <circle cx="248" cy="500" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="248" y="505" fill="#fff">6</text>
    <!-- MC llegador 8 a la frontal -->
    <circle cx="320" cy="330" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="320" y="335" fill="#fff">8</text>
    <!-- Extremo izquierdo (lejano) cerrando al segundo palo -->
    <circle cx="430" cy="200" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="430" y="205" fill="#fff">EI</text>

    <!-- DC primer palo (posicion de salida) -->
    <circle cx="248" cy="258" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="248" y="263" fill="#fff">DC</text>
    <!-- DC segundo palo (posicion de salida) -->
    <circle cx="360" cy="258" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="263" fill="#fff">DC</text>
  </g>

  <!-- Etiquetas de zonas de remate -->
  <g font-size="11" font-weight="700" fill="#ffd24a" text-anchor="middle">
    <text x="216" y="166">1er palo</text>
    <text x="300" y="186">pto penalti</text>
    <text x="392" y="166">2º palo</text>
    <text x="304" y="232">frontal</text>
  </g>

  <!-- Leyenda -->
  <g>
    <rect x="362" y="704" width="214" height="98" fill="#1d3557" fill-opacity="0.82" rx="6"/>
    <text x="374" y="724" fill="#ffffff" font-size="12" font-weight="700">Leyenda</text>
    <line x1="374" y1="738" x2="412" y2="738" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="420" y="742" fill="#ffffff" font-size="11">movimiento</text>
    <line x1="374" y1="758" x2="412" y2="758" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowCross)"/>
    <text x="420" y="762" fill="#ffffff" font-size="11">centro</text>
    <line x1="374" y1="776" x2="412" y2="776" stroke="#ffd24a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowPass)"/>
    <text x="420" y="780" fill="#ffffff" font-size="11">cut-back</text>
    <circle cx="382" cy="794" r="6" fill="#1d6fb8" stroke="#fff" stroke-width="1.5"/><text x="394" y="798" fill="#ffffff" font-size="11">propio</text>
    <circle cx="470" cy="794" r="6" fill="#c0392b" stroke="#fff" stroke-width="1.5"/><text x="482" y="798" fill="#ffffff" font-size="11">rival</text>
  </g>
</svg>
