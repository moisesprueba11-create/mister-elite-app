<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <marker id="arrowPass" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd24a"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="860" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="60"  width="560" height="93" />
    <rect x="20" y="246" width="560" height="93" />
    <rect x="20" y="432" width="560" height="93" />
    <rect x="20" y="618" width="560" height="93" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="132" y1="60" x2="132" y2="804"/>
    <line x1="244" y1="60" x2="244" y2="804"/>
    <line x1="356" y1="60" x2="356" y2="804"/>
    <line x1="468" y1="60" x2="468" y2="804"/>
  </g>
  <!-- Franjas horizontales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="20" y1="308" x2="580" y2="308"/>
    <line x1="20" y1="556" x2="580" y2="556"/>
  </g>

  <!-- Lineas del campo -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="60" width="560" height="744"/>
    <line x1="20" y1="432" x2="580" y2="432"/>
    <circle cx="300" cy="432" r="62"/>
    <rect x="148" y="60" width="304" height="100"/>
    <rect x="232" y="60" width="136" height="40"/>
    <rect x="148" y="704" width="304" height="100"/>
    <rect x="232" y="764" width="136" height="40"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="432" r="3"/>
    <circle cx="300" cy="130" r="3"/>
    <circle cx="300" cy="734" r="3"/>
  </g>
  <path d="M252,160 A56,56 0 0 0 348,160" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M252,704 A56,56 0 0 1 348,704" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Salida 3+2: descenso del "6" entre centrales</text>

  <text x="560" y="430" fill="#ffffff" font-size="12" text-anchor="end" opacity="0.8">ataque ↑</text>

  <!-- Pases de circulacion (discontinua = pase) -->
  <g fill="none" stroke="#ffd24a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowPass)">
    <line x1="300" y1="740" x2="300" y2="688"/>
    <line x1="278" y1="652" x2="224" y2="660"/>
    <line x1="322" y1="652" x2="376" y2="660"/>
    <line x1="184" y1="648" x2="112" y2="500"/>
    <line x1="416" y1="648" x2="488" y2="500"/>
  </g>

  <!-- Movimiento del 6 que baja (continua = movimiento) -->
  <g fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)">
    <line x1="300" y1="512" x2="300" y2="636"/>
    <line x1="110" y1="636" x2="110" y2="504"/>
    <line x1="490" y1="636" x2="490" y2="504"/>
  </g>

  <!-- Rivales (dos delanteros presionando) -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="248" cy="560" r="20" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="248" y="565" fill="#fff">DC</text>
    <circle cx="352" cy="560" r="20" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="352" y="565" fill="#fff">DC</text>
  </g>
  <text x="300" y="598" fill="#ffd24a" font-size="12" font-weight="700" text-anchor="middle">2 delanteros rivales</text>

  <!-- Balon -->
  <circle cx="300" cy="745" r="7" fill="url(#ball)" stroke="#1d3557" stroke-width="1.5"/>

  <!-- Jugadores propios -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <polygon points="300,752 312,774 288,774" fill="#1d3557" stroke="#ffffff" stroke-width="2"/>
    <text x="300" y="793" fill="#ffffff" font-size="13">POR (1)</text>

    <!-- Laterales altos y abiertos -->
    <circle cx="110" cy="484" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="110" y="489" fill="#fff">LD</text>
    <circle cx="490" cy="484" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="490" y="489" fill="#fff">LI</text>

    <!-- Tres de salida: 2 DFC abiertos + 6 entre ellos -->
    <circle cx="200" cy="660" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="200" y="665" fill="#fff">DFC</text>
    <circle cx="400" cy="660" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="400" y="665" fill="#fff">DFC</text>
    <circle cx="300" cy="660" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="300" y="665" fill="#fff">6</text>

    <!-- 8 mas adelantado -->
    <circle cx="352" cy="468" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="352" y="473" fill="#fff">8</text>
    <!-- Delanteros propios -->
    <circle cx="240" cy="270" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="240" y="275" fill="#fff">DC</text>
    <circle cx="360" cy="270" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="275" fill="#fff">DC</text>
  </g>

  <!-- Tag superioridad -->
  <text x="300" y="712" fill="#ffd24a" font-size="13" font-weight="700" text-anchor="middle">Superioridad 3 vs 2 en primera línea</text>

  <!-- Leyenda -->
  <g>
    <rect x="20" y="64" width="214" height="80" fill="#1d3557" fill-opacity="0.82" rx="6"/>
    <text x="32" y="84" fill="#ffffff" font-size="12" font-weight="700">Leyenda</text>
    <line x1="32" y1="98" x2="70" y2="98" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="78" y="102" fill="#ffffff" font-size="11">movimiento</text>
    <line x1="32" y1="118" x2="70" y2="118" stroke="#ffd24a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowPass)"/>
    <text x="78" y="122" fill="#ffffff" font-size="11">pase / circulación</text>
    <circle cx="40" cy="135" r="6" fill="#1d6fb8" stroke="#fff" stroke-width="1.5"/><text x="52" y="139" fill="#ffffff" font-size="11">propio</text>
    <circle cx="120" cy="135" r="6" fill="#c0392b" stroke="#fff" stroke-width="1.5"/><text x="132" y="139" fill="#ffffff" font-size="11">rival</text>
  </g>
</svg>
