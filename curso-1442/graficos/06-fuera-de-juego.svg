<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="860" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="60"  width="560" height="93" />
    <rect x="20" y="246" width="560" height="93" />
    <rect x="20" y="432" width="560" height="93" />
    <rect x="20" y="618" width="560" height="93" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="132" y1="60" x2="132" y2="804"/>
    <line x1="244" y1="60" x2="244" y2="804"/>
    <line x1="356" y1="60" x2="356" y2="804"/>
    <line x1="468" y1="60" x2="468" y2="804"/>
  </g>
  <!-- Franjas horizontales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="20" y1="308" x2="580" y2="308"/>
    <line x1="20" y1="556" x2="580" y2="556"/>
  </g>

  <!-- Lineas del campo -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="60" width="560" height="744"/>
    <line x1="20" y1="432" x2="580" y2="432"/>
    <circle cx="300" cy="432" r="62"/>
    <!-- Area grande superior (porteria rival) -->
    <rect x="148" y="60" width="304" height="100"/>
    <rect x="232" y="60" width="136" height="40"/>
    <!-- Area grande inferior (porteria propia) -->
    <rect x="148" y="704" width="304" height="100"/>
    <rect x="232" y="764" width="136" height="40"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="432" r="3"/>
    <circle cx="300" cy="130" r="3"/>
    <circle cx="300" cy="734" r="3"/>
  </g>
  <path d="M252,160 A56,56 0 0 0 348,160" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M252,704 A56,56 0 0 1 348,704" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Subida de la línea: trampa del fuera de juego</text>

  <!-- Sentido de ataque -->
  <text x="560" y="430" fill="#ffffff" font-size="12" text-anchor="end" opacity="0.8">ataque ↑</text>

  <!-- Linea anterior (donde estaban) - tenue -->
  <line x1="20" y1="660" x2="580" y2="660" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 6" stroke-opacity="0.35"/>
  <text x="30" y="652" fill="#ffffff" font-size="11" opacity="0.55" text-anchor="start">posición anterior</text>

  <!-- Linea nueva de fuera de juego (mas alta) -->
  <line x1="20" y1="510" x2="580" y2="510" stroke="#ffd24a" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="30" y="502" fill="#ffd24a" font-size="13" font-weight="700" text-anchor="start">línea de fuera de juego</text>

  <!-- Flechas de subida coordinada (como una persiana, al unisono) -->
  <g stroke="#1d3557" stroke-width="3.5" fill="none" marker-end="url(#arrow)">
    <line x1="110" y1="650" x2="110" y2="540"/>
    <line x1="240" y1="650" x2="240" y2="540"/>
    <line x1="360" y1="650" x2="360" y2="540"/>
    <line x1="490" y1="650" x2="490" y2="540"/>
  </g>

  <!-- Delanteros rivales atrapados en fuera de juego (por detras = debajo de la linea) -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="250" cy="575" r="19" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="250" y="580" fill="#fff">DC'</text>
    <circle cx="370" cy="585" r="19" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="370" y="590" fill="#fff">DC'</text>
  </g>
  <!-- Banderines de fuera de juego (FJ) -->
  <g>
    <line x1="269" y1="558" x2="269" y2="535" stroke="#ffd24a" stroke-width="2.5"/>
    <polygon points="269,535 290,540 269,545" fill="#ffd24a"/>
    <text x="296" y="544" fill="#ffd24a" font-size="12" font-weight="700" text-anchor="start">FJ</text>
    <line x1="389" y1="568" x2="389" y2="545" stroke="#ffd24a" stroke-width="2.5"/>
    <polygon points="389,545 410,550 389,555" fill="#ffd24a"/>
    <text x="416" y="554" fill="#ffd24a" font-size="12" font-weight="700" text-anchor="start">FJ</text>
  </g>

  <!-- Linea defensiva propia (back four) en la nueva linea alta -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <!-- Portero adelantado como libero -->
    <polygon points="300,690 312,712 288,712" fill="#1d3557" stroke="#ffffff" stroke-width="2"/>
    <text x="300" y="731" fill="#ffffff" font-size="12">POR (líbero)</text>

    <g>
      <circle cx="110" cy="525" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="110" y="530" fill="#fff">LD</text>
      <circle cx="240" cy="525" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="240" y="530" fill="#fff">DFC</text>
      <circle cx="360" cy="525" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="530" fill="#fff">DFC</text>
      <circle cx="490" cy="525" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="490" y="530" fill="#fff">LI</text>
    </g>
  </g>

  <!-- Callout: central de coberturas ordena -->
  <g>
    <line x1="360" y1="505" x2="430" y2="455" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="408" y="424" width="172" height="34" rx="5" fill="#1d3557" stroke="#ffffff" stroke-width="1.5"/>
    <text x="494" y="445" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">central de coberturas: ordena</text>
  </g>

  <!-- Mini-leyenda -->
  <g>
    <rect x="20" y="816" width="560" height="34" fill="#1d3557" fill-opacity="0.85"/>
    <line x1="40" y1="833" x2="80" y2="833" stroke="#ffd24a" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="92" y="838" fill="#ffffff" font-size="12" text-anchor="start">línea de puntos = línea de fuera de juego</text>
    <line x1="370" y1="833" x2="405" y2="833" stroke="#ffffff" stroke-width="3.5" marker-end="url(#arrow)"/>
    <text x="416" y="838" fill="#ffffff" font-size="12" text-anchor="start">flecha continua = subida coordinada</text>
  </g>
</svg>
