<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <marker id="arrowKey" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd24a"/>
    </marker>
    <marker id="arrowY" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd24a"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="860" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="60"  width="560" height="93" />
    <rect x="20" y="246" width="560" height="93" />
    <rect x="20" y="432" width="560" height="93" />
    <rect x="20" y="618" width="560" height="93" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="132" y1="60" x2="132" y2="804"/>
    <line x1="244" y1="60" x2="244" y2="804"/>
    <line x1="356" y1="60" x2="356" y2="804"/>
    <line x1="468" y1="60" x2="468" y2="804"/>
  </g>

  <!-- Lineas del campo -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="60" width="560" height="744"/>
    <line x1="20" y1="432" x2="580" y2="432"/>
    <circle cx="300" cy="432" r="62"/>
    <rect x="148" y="60" width="304" height="100"/>
    <rect x="232" y="60" width="136" height="40"/>
    <rect x="148" y="704" width="304" height="100"/>
    <rect x="232" y="764" width="136" height="40"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="432" r="3"/>
    <circle cx="300" cy="130" r="3"/>
    <circle cx="300" cy="734" r="3"/>
  </g>
  <path d="M252,160 A56,56 0 0 0 348,160" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M252,704 A56,56 0 0 1 348,704" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <text x="560" y="430" fill="#ffffff" font-size="12" text-anchor="end" opacity="0.8">ataque ↑</text>

  <!-- Punto de perdida cerca de campo rival + balon -->
  <circle cx="300" cy="200" r="6" fill="url(#ball)" stroke="#cccccc"/>
  <text x="300" y="184" fill="#ffd24a" font-size="12" font-weight="700" text-anchor="middle">pérdida</text>

  <!-- Posiciones objetivo (dos lineas de cuatro) - tenues -->
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 4" stroke-opacity="0.45">
    <circle cx="130" cy="470" r="20"/>
    <circle cx="244" cy="470" r="20"/>
    <circle cx="356" cy="470" r="20"/>
    <circle cx="470" cy="470" r="20"/>
    <circle cx="130" cy="640" r="20"/>
    <circle cx="244" cy="640" r="20"/>
    <circle cx="356" cy="640" r="20"/>
    <circle cx="470" cy="640" r="20"/>
  </g>
  <g fill="#ffffff" font-size="11" text-anchor="start" opacity="0.7">
    <text x="500" y="474">línea de 4 (medios)</text>
    <text x="500" y="644">línea de 4 (defensa)</text>
  </g>

  <!-- Jugador MAS CERCA del balon: ocupa el EJE CENTRAL para frenar el balon central (DESTACADO) -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="360" cy="300" r="21" fill="#1d6fb8" stroke="#ffd24a" stroke-width="4"/><text x="360" y="305" fill="#fff">MC</text>
  </g>
  <text x="360" y="278" fill="#ffd24a" font-size="11" font-weight="700" text-anchor="middle">"8"</text>
  <!-- Flecha clave hacia el CENTRO (no hacia fuera) -->
  <path d="M345,318 C320,400 305,430 300,450" fill="none" stroke="#ffd24a" stroke-width="4.5" marker-end="url(#arrowKey)"/>
  <text x="240" y="400" fill="#ffd24a" font-size="12" font-weight="700" text-anchor="middle">frena el centro</text>

  <!-- Resto: cada uno a SU carril vertical (recto hacia atras) -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="100" cy="320" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="100" y="325" fill="#fff">MD</text>
    <circle cx="248" cy="350" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="248" y="355" fill="#fff">MC</text>
    <circle cx="500" cy="320" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="500" y="325" fill="#fff">MI</text>
    <circle cx="120" cy="500" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="120" y="505" fill="#fff">LD</text>
    <circle cx="250" cy="520" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="250" y="525" fill="#fff">DFC</text>
    <circle cx="360" cy="520" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="525" fill="#fff">DFC</text>
    <circle cx="480" cy="500" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="480" y="505" fill="#fff">LI</text>
  </g>

  <!-- Flechas rectas a su carril (vertical, no diagonal) -->
  <g fill="none" stroke="#1d3557" stroke-width="3">
    <path d="M100,340 L128,450" marker-end="url(#arrow)"/>
    <path d="M248,372 L244,448" marker-end="url(#arrow)"/>
    <path d="M500,340 L472,450" marker-end="url(#arrow)"/>
    <path d="M120,522 L129,618" marker-end="url(#arrow)"/>
    <path d="M250,542 L245,618" marker-end="url(#arrow)"/>
    <path d="M360,542 L357,618" marker-end="url(#arrow)"/>
    <path d="M480,522 L471,618" marker-end="url(#arrow)"/>
  </g>

  <!-- Portero -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <polygon points="300,752 312,774 288,774" fill="#1d3557" stroke="#ffffff" stroke-width="2"/>
    <text x="300" y="793" fill="#ffffff" font-size="13">POR (1)</text>
  </g>

  <!-- Oponentes -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="300" cy="240" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2"/><text x="300" y="245" fill="#fff">MC'</text>
    <circle cx="180" cy="180" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2"/><text x="180" y="185" fill="#fff">LI'</text>
    <circle cx="430" cy="170" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2"/><text x="430" y="175" fill="#fff">DC'</text>
  </g>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Transición defensiva: repliegue a las dos líneas de cuatro</text>

  <!-- Etiqueta clave -->
  <text x="300" y="740" fill="#ffd24a" font-size="13" font-weight="700" text-anchor="middle">frenar el centro primero, recomponer después</text>

  <!-- Mini-leyenda -->
  <g>
    <rect x="32" y="556" width="180" height="92" fill="#1d3557" fill-opacity="0.85" stroke="#ffffff" stroke-width="1" rx="4"/>
    <text x="42" y="574" fill="#ffffff" font-size="11" font-weight="700">Leyenda</text>
    <line x1="42" y1="590" x2="72" y2="590" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="78" y="594" fill="#ffffff" font-size="10">repliegue a su carril</text>
    <line x1="42" y1="608" x2="72" y2="608" stroke="#ffd24a" stroke-width="4.5" marker-end="url(#arrowKey)"/>
    <text x="78" y="612" fill="#ffffff" font-size="10">frenar balón central</text>
    <circle cx="47" cy="626" r="9" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 4" stroke-opacity="0.7"/>
    <text x="78" y="630" fill="#ffffff" font-size="10">posición objetivo</text>
  </g>
</svg>
