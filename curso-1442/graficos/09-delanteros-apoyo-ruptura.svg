<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d3557"/>
    </marker>
    <marker id="arrowPass" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd24a"/>
    </marker>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- Cesped con franjas -->
  <rect x="0" y="0" width="600" height="860" fill="#2e7d32"/>
  <g fill="#2f8235">
    <rect x="20" y="60"  width="560" height="93" />
    <rect x="20" y="246" width="560" height="93" />
    <rect x="20" y="432" width="560" height="93" />
    <rect x="20" y="618" width="560" height="93" />
  </g>

  <!-- Carriles verticales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="132" y1="60" x2="132" y2="804"/>
    <line x1="244" y1="60" x2="244" y2="804"/>
    <line x1="356" y1="60" x2="356" y2="804"/>
    <line x1="468" y1="60" x2="468" y2="804"/>
  </g>
  <!-- Franjas horizontales (referencia) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <line x1="20" y1="308" x2="580" y2="308"/>
    <line x1="20" y1="556" x2="580" y2="556"/>
  </g>

  <!-- Lineas del campo -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <rect x="20" y="60" width="560" height="744"/>
    <line x1="20" y1="432" x2="580" y2="432"/>
    <circle cx="300" cy="432" r="62"/>
    <rect x="148" y="60" width="304" height="100"/>
    <rect x="232" y="60" width="136" height="40"/>
    <rect x="148" y="704" width="304" height="100"/>
    <rect x="232" y="764" width="136" height="40"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="432" r="3"/>
    <circle cx="300" cy="130" r="3"/>
    <circle cx="300" cy="734" r="3"/>
  </g>
  <path d="M252,160 A56,56 0 0 0 348,160" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M252,704 A56,56 0 0 1 348,704" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Titulo -->
  <rect x="0" y="0" width="600" height="44" fill="#1d3557"/>
  <text x="300" y="29" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Delanteros: apoyo y ruptura</text>

  <text x="560" y="430" fill="#ffffff" font-size="12" text-anchor="end" opacity="0.8">ataque ↑</text>

  <!-- Ultima linea rival (punteada) -->
  <line x1="40" y1="220" x2="560" y2="220" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 6" opacity="0.95"/>
  <text x="552" y="212" fill="#c0392b" font-size="12" font-weight="700" text-anchor="end">última línea rival</text>

  <!-- Defensas rivales sobre la linea -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="170" cy="220" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="170" y="225" fill="#fff">DFC</text>
    <circle cx="290" cy="220" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="290" y="225" fill="#fff">DFC</text>
    <circle cx="410" cy="220" r="18" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/><text x="410" y="225" fill="#fff">DFC</text>
  </g>

  <!-- Pase al delantero de apoyo (discontinua = pase) -->
  <g fill="none" stroke="#ffd24a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowPass)">
    <line x1="248" y1="482" x2="244" y2="344"/>
  </g>
  <!-- Pase filtrado / descarga al que rompe (discontinua) -->
  <g fill="none" stroke="#ffd24a" stroke-width="3.4" stroke-dasharray="9 7" marker-end="url(#arrowPass)">
    <path d="M258,308 C330,288 388,250 444,176"/>
  </g>

  <!-- Movimiento de apoyo (baja a recibir) -->
  <g fill="none" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)">
    <line x1="240" y1="256" x2="240" y2="300"/>
  </g>
  <!-- Movimiento de ruptura en diagonal a la espalda -->
  <g fill="none" stroke="#1d3557" stroke-width="3.4" marker-end="url(#arrow)">
    <line x1="372" y1="258" x2="452" y2="168"/>
  </g>

  <!-- Balon -->
  <circle cx="244" cy="332" r="7" fill="url(#ball)" stroke="#1d3557" stroke-width="1.5"/>

  <!-- Jugadores propios -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <polygon points="300,752 312,774 288,774" fill="#1d3557" stroke="#ffffff" stroke-width="2"/>
    <text x="300" y="793" fill="#ffffff" font-size="13">POR (1)</text>

    <circle cx="110" cy="660" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="110" y="665" fill="#fff">LD</text>
    <circle cx="240" cy="676" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="240" y="681" fill="#fff">DFC</text>
    <circle cx="360" cy="676" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="360" y="681" fill="#fff">DFC</text>
    <circle cx="490" cy="660" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="490" y="665" fill="#fff">LI</text>

    <circle cx="100" cy="470" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="100" y="475" fill="#fff">MD</text>
    <!-- MC con balon, da el pase de apoyo -->
    <circle cx="248" cy="492" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="248" y="497" fill="#fff">MC</text>
    <circle cx="352" cy="468" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="352" y="473" fill="#fff">MC</text>
    <circle cx="500" cy="470" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="500" y="475" fill="#fff">MI</text>

    <!-- Delantero de APOYO (baja a recibir entre lineas) -->
    <circle cx="244" cy="332" r="20" fill="#1d6fb8" stroke="#ffd24a" stroke-width="3"/><text x="244" y="337" fill="#fff">DC</text>
    <!-- Delantero de RUPTURA (posicion inicial) -->
    <circle cx="372" cy="258" r="20" fill="#1d6fb8" stroke="#ffffff" stroke-width="2.5"/><text x="372" y="263" fill="#fff">DC</text>
  </g>

  <!-- Etiquetas de rol -->
  <g font-size="12" font-weight="700" fill="#ffd24a" text-anchor="middle">
    <text x="244" y="372">apoyo (entre líneas)</text>
    <text x="440" y="262" text-anchor="start">ruptura (diagonal)</text>
  </g>

  <!-- Leyenda -->
  <g>
    <rect x="360" y="700" width="216" height="102" fill="#1d3557" fill-opacity="0.82" rx="6"/>
    <text x="372" y="720" fill="#ffffff" font-size="12" font-weight="700">Leyenda</text>
    <line x1="372" y1="736" x2="410" y2="736" stroke="#1d3557" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="418" y="740" fill="#ffffff" font-size="11">movimiento</text>
    <line x1="372" y1="756" x2="410" y2="756" stroke="#ffd24a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowPass)"/>
    <text x="418" y="760" fill="#ffffff" font-size="11">pase filtrado / descarga</text>
    <line x1="372" y1="776" x2="410" y2="776" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 6"/>
    <text x="418" y="780" fill="#ffffff" font-size="11">última línea rival</text>
    <circle cx="380" cy="794" r="6" fill="#1d6fb8" stroke="#fff" stroke-width="1.5"/><text x="392" y="798" fill="#ffffff" font-size="11">propio</text>
    <circle cx="470" cy="794" r="6" fill="#c0392b" stroke="#fff" stroke-width="1.5"/><text x="482" y="798" fill="#ffffff" font-size="11">rival</text>
  </g>
</svg>
