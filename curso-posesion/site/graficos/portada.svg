<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#0c1b2a"/><stop offset="0.55" stop-color="#0f2438"/><stop offset="1" stop-color="#08131f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7c948"/><stop offset="1" stop-color="#e0a526"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.6"><stop offset="0" stop-color="#1d6fb8" stop-opacity="0.35"/><stop offset="1" stop-color="#1d6fb8" stop-opacity="0"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f7c948"/></marker>
  </defs>
  <rect width="794" height="1123" fill="url(#bg)"/><rect width="794" height="1123" fill="url(#glow)"/>

  <!-- cuadrícula de juego de posición (carriles + líneas) -->
  <g opacity="0.9">
    <rect x="150" y="600" width="494" height="430" rx="10" fill="#1f7a36" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5">
      <line x1="248.8" y1="600" x2="248.8" y2="1030"/><line x1="347.6" y1="600" x2="347.6" y2="1030"/>
      <line x1="446.4" y1="600" x2="446.4" y2="1030"/><line x1="545.2" y1="600" x2="545.2" y2="1030"/>
      <line x1="150" y1="743" x2="644" y2="743"/><line x1="150" y1="886" x2="644" y2="886"/>
    </g>
    <!-- pases que rompen líneas -->
    <g stroke="#f7c948" stroke-width="2.4" stroke-dasharray="7 6" opacity="0.85" marker-end="url(#ar)" fill="none">
      <line x1="300" y1="965" x2="397" y2="820"/>
      <line x1="397" y1="800" x2="500" y2="690"/>
    </g>
    <!-- defensores -->
    <circle cx="350" cy="812" r="19" fill="#c62828" stroke="#7f1414" stroke-width="2.5"/>
    <circle cx="445" cy="812" r="19" fill="#c62828" stroke="#7f1414" stroke-width="2.5"/>
    <!-- poseedores en carriles -->
    <g font-size="0">
      <circle cx="300" cy="965" r="18" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/>
      <circle cx="200" cy="880" r="18" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/>
      <circle cx="595" cy="880" r="18" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/>
      <circle cx="500" cy="690" r="18" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/>
    </g>
    <!-- HOMBRE LIBRE entre líneas (resaltado) -->
    <circle cx="397" cy="810" r="22" fill="#26c6da" stroke="#f7c948" stroke-width="3"/>
    <text x="397" y="850" font-size="13" font-weight="800" fill="#f7c948" text-anchor="middle">hombre libre</text>
    <!-- balón -->
    <circle cx="312" cy="958" r="7.5" fill="#fafafa" stroke="#222" stroke-width="1.4"/>
  </g>

  <rect x="0" y="0" width="794" height="8" fill="url(#gold)"/>
  <g transform="translate(64,92)">
    <rect x="0" y="0" width="46" height="46" rx="10" fill="url(#gold)"/>
    <text x="23" y="32" font-size="28" font-weight="900" fill="#0c1b2a" text-anchor="middle">ME</text>
    <text x="62" y="22" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3">MISTER ÉLITE</text>
    <text x="62" y="41" font-size="12.5" font-weight="600" fill="#f7c948" letter-spacing="2">ACADEMIA DE ENTRENADORES · MOISÉS DÍAZ</text>
  </g>
  <g transform="translate(64,295)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#7fd0ff" letter-spacing="5">CURSO DE METODOLOGÍA</text>
    <text x="0" y="70" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1">JUEGO DE</text>
    <text x="0" y="128" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1">POSICIÓN</text>
    <text x="0" y="172" font-size="24" font-weight="800" fill="#f7c948">dominar con el balón</text>
    <line x1="4" y1="196" x2="120" y2="196" stroke="#f7c948" stroke-width="4"/>
    <text x="0" y="232" font-size="17" font-weight="500" fill="#cdd9e5">Superioridades · hombre libre · tercer hombre</text>
  </g>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(470,330)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="34" font-weight="900" fill="#f7c948">30</text><text x="18" y="66" font-size="12" fill="#cdd9e5">tareas de campo</text></g>
    <g transform="translate(632,330)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="34" font-weight="900" fill="#f7c948">4</text><text x="18" y="66" font-size="12" fill="#cdd9e5">módulos de teoría</text></g>
    <g transform="translate(470,422)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="30" font-weight="900" fill="#f7c948">ANIM</text><text x="18" y="66" font-size="12" fill="#cdd9e5">conceptos animados</text></g>
    <g transform="translate(632,422)"><rect width="150" height="80" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="44" font-size="34" font-weight="900" fill="#f7c948">6</text><text x="18" y="66" font-size="12" fill="#cdd9e5">familias de tarea</text></g>
  </g>
  <rect x="0" y="1080" width="794" height="43" fill="#08131f"/>
  <text x="64" y="1107" font-size="13" font-weight="600" fill="#8aa0b6">Rondos · Superioridades · Progresión · Finalización</text>
  <text x="730" y="1107" font-size="13" font-weight="800" fill="#f7c948" text-anchor="end">MISTER ÉLITE</text>
  <rect x="0" y="1115" width="794" height="8" fill="url(#gold)"/>
</svg>
