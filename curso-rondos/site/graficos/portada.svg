<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0c1b2a"/><stop offset="0.55" stop-color="#0f2438"/><stop offset="1" stop-color="#08131f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c948"/><stop offset="1" stop-color="#e0a526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.6">
      <stop offset="0" stop-color="#1d6fb8" stop-opacity="0.35"/><stop offset="1" stop-color="#1d6fb8" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7c948"/>
    </marker>
  </defs>
  <rect width="794" height="1123" fill="url(#bg)"/>
  <rect width="794" height="1123" fill="url(#glow)"/>

  <!-- Cuadro de rondo de fondo (sutil) -->
  <rect x="190" y="600" width="414" height="414" rx="16" fill="#1f7a36" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="9 7"/>

  <!-- RONDO: poseedores (azul) alrededor, defensores (rojo) en el medio, pases -->
  <g>
    <!-- líneas de pase (perímetro) -->
    <g stroke="#f7c948" stroke-width="2.4" stroke-dasharray="7 6" opacity="0.8" marker-end="url(#ar)" fill="none">
      <line x1="270" y1="660" x2="500" y2="640"/>
      <line x1="540" y1="675" x2="560" y2="880"/>
      <line x1="545" y1="930" x2="320" y2="955"/>
      <line x1="250" y1="930" x2="235" y2="710"/>
    </g>
    <!-- defensores en el centro -->
    <g font-size="0">
      <circle cx="372" cy="800" r="20" fill="#c62828" stroke="#7f1414" stroke-width="2.5"/>
      <circle cx="430" cy="820" r="20" fill="#c62828" stroke="#7f1414" stroke-width="2.5"/>
    </g>
    <!-- poseedores en el perímetro -->
    <g>
      <circle cx="245" cy="675" r="19" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/>
      <circle cx="400" cy="628" r="19" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/>
      <circle cx="552" cy="668" r="19" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/>
      <circle cx="568" cy="905" r="19" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/>
      <circle cx="400" cy="966" r="19" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/>
      <circle cx="232" cy="900" r="19" fill="#0d3c75" stroke="#1d6fb8" stroke-width="2.5"/>
    </g>
    <!-- balón -->
    <circle cx="263" cy="668" r="8" fill="#fafafa" stroke="#222" stroke-width="1.4"/>
    <path d="M263,660 l4,5.6 l-6.4,0 z" fill="#222"/>
    <!-- conos en esquinas del cuadro -->
    <g fill="#ff9800" stroke="#7a4f00" stroke-width="1">
      <path d="M190,600 l5,11 l-10,0 z"/><path d="M604,600 l5,11 l-10,0 z"/>
      <path d="M190,1014 l5,11 l-10,0 z"/><path d="M604,1014 l5,11 l-10,0 z"/>
    </g>
  </g>

  <!-- Banda de marca -->
  <rect x="0" y="0" width="794" height="8" fill="url(#gold)"/>
  <g transform="translate(64,92)">
    <rect x="0" y="0" width="46" height="46" rx="10" fill="url(#gold)"/>
    <text x="23" y="32" font-size="28" font-weight="900" fill="#0c1b2a" text-anchor="middle">ME</text>
    <text x="62" y="22" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3">MISTER ÉLITE</text>
    <text x="62" y="41" font-size="12.5" font-weight="600" fill="#f7c948" letter-spacing="2">ACADEMIA DE ENTRENADORES · MOISÉS DÍAZ</text>
  </g>

  <!-- Titular -->
  <g transform="translate(64,300)">
    <text x="0" y="0" font-size="17" font-weight="700" fill="#7fd0ff" letter-spacing="6">CURSO DE METODOLOGÍA</text>
    <text x="0" y="80" font-size="80" font-weight="900" fill="#ffffff" letter-spacing="0">RONDOS</text>
    <text x="0" y="138" font-size="25" font-weight="800" fill="#f7c948">el corazón del entrenamiento</text>
    <line x1="4" y1="166" x2="120" y2="166" stroke="#f7c948" stroke-width="4"/>
    <text x="0" y="206" font-size="18" font-weight="500" fill="#cdd9e5">Un poco de teoría. 50 rondos para el campo.</text>
  </g>

  <!-- Tarjetas -->
  <g font-family="Segoe UI,Arial">
    <g transform="translate(470,318)"><rect width="150" height="84" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="46" font-size="36" font-weight="900" fill="#f7c948">50</text><text x="18" y="68" font-size="12" fill="#cdd9e5">rondos de campo</text></g>
    <g transform="translate(632,318)"><rect width="150" height="84" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="46" font-size="36" font-weight="900" fill="#f7c948">3</text><text x="18" y="68" font-size="12" fill="#cdd9e5">módulos de teoría</text></g>
    <g transform="translate(470,414)"><rect width="150" height="84" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="46" font-size="36" font-weight="900" fill="#f7c948">7</text><text x="18" y="68" font-size="12" fill="#cdd9e5">familias de rondo</text></g>
    <g transform="translate(632,414)"><rect width="150" height="84" rx="12" fill="#13283d" stroke="#24435f"/><text x="18" y="46" font-size="34" font-weight="900" fill="#f7c948">+50</text><text x="18" y="68" font-size="12" fill="#cdd9e5">pizarras tácticas</text></g>
  </g>

  <!-- Pie -->
  <rect x="0" y="1080" width="794" height="43" fill="#08131f"/>
  <text x="64" y="1107" font-size="13" font-weight="600" fill="#8aa0b6">Mantenimiento · Presión · Orientación · Finalización · Competición</text>
  <text x="730" y="1107" font-size="13" font-weight="800" fill="#f7c948" text-anchor="end">MISTER ÉLITE</text>
  <rect x="0" y="1115" width="794" height="8" fill="url(#gold)"/>
</svg>
