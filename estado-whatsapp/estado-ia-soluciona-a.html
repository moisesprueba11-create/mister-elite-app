<!doctype html>
<meta charset="utf-8">
<style>
  @page { size: 1080px 1920px; margin: 0 }
  * { margin:0; padding:0; box-sizing:border-box }
  html,body { width:1080px; height:1920px }
  body{
    font-family:'Liberation Sans','DejaVu Sans',sans-serif;
    background:#0d1620; color:#f5f4f0; overflow:hidden; position:relative;
  }

  /* --- fondo: campo estilizado --- */
  .field{ position:absolute; inset:0; overflow:hidden }
  .field svg{ position:absolute; inset:0 }
  .glow{
    position:absolute; left:50%; top:44%; width:1500px; height:1500px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(29,111,184,.30) 0%, rgba(29,111,184,.10) 38%, rgba(13,22,32,0) 68%);
  }
  .vign{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(13,22,32,.92) 0%, rgba(13,22,32,.30) 30%, rgba(13,22,32,.55) 70%, rgba(13,22,32,.96) 100%);
  }

  /* --- estructura --- */
  .wrap{ position:relative; height:100%; display:flex; flex-direction:column;
         padding:150px 96px 130px }

  /* zona segura arriba (WhatsApp tapa ~230px) */
  .kicker{ display:flex; align-items:center; gap:22px; margin-bottom:auto }
  .kicker .bar{ width:78px; height:7px; background:#d4a537; border-radius:4px }
  .kicker span{ font-size:31px; letter-spacing:.30em; font-weight:700; color:#cdd6df }

  .eyebrow{
    font-size:47px; line-height:1.28; font-weight:700; color:#9fb2c4;
    letter-spacing:.01em; margin-bottom:34px;
  }
  .eyebrow b{ color:#f5f4f0 }

  h1{ font-size:144px; line-height:.96; font-weight:800; letter-spacing:-.035em }
  h1 .go{ color:#d4a537; display:block }

  .rule{ width:210px; height:9px; background:#1d6fb8; border-radius:5px; margin:60px 0 54px }

  ul{ list-style:none; display:flex; flex-direction:column; gap:34px }
  li{ display:flex; align-items:flex-start; gap:28px; font-size:46px; line-height:1.24; color:#e8ecf1; font-weight:600 }
  li .tick{
    flex:none; width:56px; height:56px; border-radius:50%;
    background:#1d6fb8; color:#fff; font-size:33px; font-weight:800;
    display:flex; align-items:center; justify-content:center; margin-top:3px;
  }

  .foot{ margin-top:auto }
  .cta{
    display:inline-flex; align-items:center; gap:24px;
    background:#d4a537; color:#101a24; font-size:44px; font-weight:800;
    padding:34px 54px; border-radius:999px; letter-spacing:.005em;
  }
  .cta .dot{ width:20px; height:20px; border-radius:50%; background:#101a24 }
  .brand{ margin-top:52px; font-size:34px; letter-spacing:.24em; font-weight:700; color:#8fa2b4 }
  .brand b{ color:#f5f4f0 }
</style>

<div class="field">
  <svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
    <g stroke="#2e4e6b" stroke-width="3" opacity=".55">
      <rect x="60" y="120" width="960" height="1680" rx="6"/>
      <line x1="60" y1="960" x2="1020" y2="960"/>
      <circle cx="540" cy="960" r="200"/>
      <circle cx="540" cy="960" r="10" fill="#2e4e6b" stroke="none"/>
      <rect x="240" y="120" width="600" height="260"/>
      <rect x="240" y="1540" width="600" height="260"/>
      <rect x="390" y="120" width="300" height="110"/>
      <rect x="390" y="1690" width="300" height="110"/>
    </g>
  </svg>
  <div class="glow"></div>
  <div class="vign"></div>
</div>

<div class="wrap">
  <div class="kicker"><i class="bar"></i><span>MISTER ÉLITE</span></div>

  <p class="eyebrow">Domingo por la noche y <b>sin sesión preparada</b>…</p>
  <h1>LA IA LO<span class="go">SOLUCIONA</span></h1>

  <div class="rule"></div>

  <ul>
    <li><i class="tick">✓</i><span>Sesión completa en <b>minutos</b>, no en horas</span></li>
    <li><i class="tick">✓</i><span>Cada tarea con su <b>pizarra</b> lista para imprimir</span></li>
    <li><i class="tick">✓</i><span>Adaptada a <b>tu sistema</b> y a tu categoría</span></li>
  </ul>

  <div class="foot">
    <div class="cta"><i class="dot"></i>Escríbeme y te lo enseño</div>
    <div class="brand">MOISÉS DÍAZ · <b>MISTER ÉLITE</b></div>
  </div>
</div>
